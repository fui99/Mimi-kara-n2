</rt></ruby>が<ruby>集<rt>あつ</rt></ruby>まった。", "vi": "Hưởng ứng lời kêu gọi tuyển tình nguyện viên, rất đông bạn trẻ đã tập hợp lại."}, {"jp_ruby": "<ruby>売<rt>う</rt></ruby>り<ruby>上<rt>あ</rt></ruby>げに<ruby>応<rt>おう</rt></ruby>じて<ruby>給料<rt>きゅうりょう</rt></ruby>が<ruby>決<rt>き</rt></ruby>まる。", "vi": "Lương được quyết định tùy theo doanh số bán hàng."}, {"jp_ruby": "子どもの<ruby>発達段階<rt>はったつだんかい</rt></ruby>に<ruby>応<rt>おう</rt></ruby>じた<ruby>本<rt>ほん</rt></ruby>を<ruby>与<rt>あた</rt></ruby>えましょう。", "vi": "Hãy cho trẻ đọc những cuốn sách phù hợp với giai đoạn phát triển của trẻ."}], "usage": {"collocations": ["｛依頼／要求／注文／募集／招き…｝に応じる"], "compounds": [], "antonyms": [], "related": [], "synonyms": ["応える"]}}, {"no": 1053, "section": "Unit 12 動詞C", "kana": "うけたまわる", "word": "承る", "form_note": "ヲ〜（謙譲語）", "meaning_en": "comply with; hear", "meaning_vi": "vâng nhận, tiếp nhận (kính ngữ khiêm nhường của 受ける); nghe, được biết (kính ngữ khiêm nhường của 聞く)", "examples": [{"jp_ruby": "「ご<ruby>注文<rt>ちゅうもん</rt></ruby>、<ruby>確<rt>たし</rt></ruby>かに<ruby>承<rt>うけたまわ</rt></ruby>りました」", "vi": "'Đơn hàng của quý khách, chúng tôi đã tiếp nhận ạ.' (承る là khiêm nhường ngữ của 受ける)"}, {"jp_ruby": "「<ruby>教授<rt>きょうじゅ</rt></ruby>のご<ruby>意見<rt>いけん</rt></ruby>を<ruby>承<rt>うけたまわ</rt></ruby>りたいのですが」", "vi": "'Tôi rất muốn được nghe ý kiến của giáo sư ạ.' (承る là khiêm nhường ngữ của 聞く)"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1054, "section": "Unit 12 動詞C", "kana": "ちょうだいする", "word": "頂戴する", "form_note": "ヲ〜", "meaning_en": "receive, accept; give; please", "meaning_vi": "nhận (khiêm nhường ngữ); cho, hãy cho (cách nói thân mật, suồng sã)", "examples": [{"jp_ruby": "「これ、お<ruby>土産<rt>みやげ</rt></ruby>です」「ありがとうございます、<ruby>頂戴<rt>ちょうだい</rt></ruby>します」", "vi": "'Đây là quà lưu niệm ạ' 'Cảm ơn anh/chị, tôi xin nhận.'"}, {"jp_ruby": "「では、これより<ruby>田中様<rt>たなかさま</rt></ruby>からスピーチを<ruby>頂戴<rt>ちょうだい</rt></ruby>いたします」", "vi": "'Tiếp theo, xin mời ông Tanaka phát biểu ạ.'"}, {"jp_ruby": "「お<ruby>客様<rt>きゃくさま</rt></ruby>から<ruby>頂戴<rt>ちょうだい</rt></ruby>したご<ruby>意見<rt>いけん</rt></ruby>は、サービス<ruby>向上<rt>こうじょう</rt></ruby>のために<ruby>生<rt>い</rt></ruby>かさせていただきます」", "vi": "'Những ý kiến quý khách đóng góp, chúng tôi sẽ vận dụng để nâng cao chất lượng dịch vụ.'"}, {"jp_ruby": "（<ruby>友<rt>とも</rt></ruby>だちに）「あ、おいしそうなケーキ。<ruby>私<rt>わたし</rt></ruby>にもちょうだい」", "vi": "(Nói với bạn bè) 'Ồ, bánh trông ngon quá. Cho tớ nữa đi.'"}, {"jp_ruby": "（子どもに）「ちょっとお<ruby>使<rt>つか</rt></ruby>いに<ruby>行<rt>い</rt></ruby>って<ruby>来<rt>き</rt></ruby>てちょうだい」", "vi": "(Nói với trẻ con) 'Đi làm việc này giúp (mẹ) một chút nào.'"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["いただく", "ください"]}}, {"no": 1055, "section": "Unit 12 動詞C", "kana": "まなぶ", "word": "学ぶ", "form_note": "ヲ〜", "meaning_en": "study; learn", "meaning_vi": "học, học hỏi", "examples": [{"jp_ruby": "<ruby>大学<rt>だいがく</rt></ruby>で<ruby>経済学<rt>けいざいがく</rt></ruby>を<ruby>学<rt>まな</rt></ruby>ぶ。", "vi": "Học kinh tế học ở trường đại học."}, {"jp_ruby": "<ruby>福井先生<rt>ふくいせんせい</rt></ruby>｛から／に｝フランス<ruby>語<rt>ご</rt></ruby>を<ruby>学<rt>まな</rt></ruby>んだ。", "vi": "Tôi đã học tiếng Pháp từ thầy Fukui."}, {"jp_ruby": "<ruby>経験<rt>けいけん</rt></ruby>から<ruby>学<rt>まな</rt></ruby>ぶ。", "vi": "Học hỏi từ kinh nghiệm."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["勉強する"]}}, {"no": 1056, "section": "Unit 12 動詞C", "kana": "ねる", "word": "練る", "form_note": "ヲ〜", "meaning_en": "knead; polish", "meaning_vi": "nhào (bột, đất sét); gọt giũa, trau chuốt (câu văn, kế hoạch)", "examples": [{"jp_ruby": "パンの<ruby>生地<rt>きじ</rt></ruby>を<ruby>練<rt>ね</rt></ruby>る。", "vi": "Nhào bột làm bánh mì."}, {"jp_ruby": "<ruby>粘土<rt>ねんど</rt></ruby>をねる。", "vi": "Nhào/nặn đất sét."}, {"jp_ruby": "<ruby>文章<rt>ぶんしょう</rt></ruby>を<ruby>練<rt>ね</rt></ruby>る。", "vi": "Gọt giũa câu văn."}, {"jp_ruby": "<ruby>作戦<rt>さくせん</rt></ruby>を<ruby>練<rt>ね</rt></ruby>る。", "vi": "Xây dựng chiến lược kỹ lưỡng."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1057, "section": "Unit 12 動詞C", "kana": "おう", "word": "負う", "form_note": "ヲ〜", "meaning_en": "carry ~ on one's back; suffer; take, assume; owe", "meaning_vi": "cõng, mang trên lưng; chịu (thương tích); gánh vác (trách nhiệm); mang (nợ)", "examples": [{"jp_ruby": "<ruby>背<rt>せ</rt></ruby>に<ruby>荷物<rt>にもつ</rt></ruby>を<ruby>負<rt>お</rt></ruby>う。", "vi": "Mang hành lý trên lưng."}, {"jp_ruby": "<ruby>事故<rt>じこ</rt></ruby>で<ruby>大<rt>おお</rt></ruby>けがを<ruby>負<rt>お</rt></ruby>った。", "vi": "Bị thương nặng trong vụ tai nạn."}, {"jp_ruby": "<ruby>国民<rt>こくみん</rt></ruby>は<ruby>納税<rt>のうぜい</rt></ruby>の<ruby>義務<rt>ぎむ</rt></ruby>を<ruby>負<rt>お</rt></ruby>う。", "vi": "Người dân có nghĩa vụ nộp thuế (gánh nghĩa vụ nộp thuế)."}, {"jp_ruby": "この<ruby>映画<rt>えいが</rt></ruby>の<ruby>成功<rt>せいこう</rt></ruby>は、<ruby>主演俳優<rt>しゅえんはいゆう</rt></ruby>の<ruby>人気<rt>にんき</rt></ruby>に<ruby>負<rt>お</rt></ruby>うところが<ruby>大<rt>おお</rt></ruby>きい。", "vi": "Thành công của bộ phim này phần lớn nhờ vào sự nổi tiếng của diễn viên chính."}], "usage": {"collocations": ["｛やけど／傷…｝を負う", "｛責任／借金…｝を負う"], "compounds": [], "antonyms": [], "related": [], "synonyms": ["背負う"]}}, {"no": 1058, "section": "Unit 12 動詞C", "kana": "はたす", "word": "果たす", "form_note": "ヲ〜", "meaning_en": "fulfill, carry out; play (a role)", "meaning_vi": "hoàn thành, thực hiện (trách nhiệm, lời hứa); đóng (vai trò)", "examples": [{"jp_ruby": "子どもが<ruby>成人<rt>せいじん</rt></ruby>して、ようやく<ruby>親<rt>おや</rt></ruby>の<ruby>責任<rt>せきにん</rt></ruby>を<ruby>果<rt>は</rt></ruby>たした。", "vi": "Con cái trưởng thành rồi, cuối cùng (tôi) cũng hoàn thành trách nhiệm làm cha mẹ."}, {"jp_ruby": "<ruby>友<rt>とも</rt></ruby>だちとの<ruby>約束<rt>やくそく</rt></ruby>を<ruby>果<rt>は</rt></ruby>たす。", "vi": "Thực hiện lời hứa với bạn."}, {"jp_ruby": "子どもが9<ruby>階<rt>かい</rt></ruby>から<ruby>落<rt>お</rt></ruby>ちたが、<ruby>木<rt>き</rt></ruby>がクッションの<ruby>役割<rt>やくわり</rt></ruby>を<ruby>果<rt>は</rt></ruby>たして、<ruby>骨折<rt>こっせつ</rt></ruby>ですんだ。", "vi": "Đứa trẻ rơi từ tầng 9 xuống nhưng cái cây đóng vai trò như tấm đệm nên chỉ bị gãy xương."}], "usage": {"collocations": ["責任を果たす", "約束を果たす", "ノルマを果たす", "任務を果たす", "役割を果たす"], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1059, "section": "Unit 12 動詞C", "kana": "ひきうける", "word": "引き受ける", "form_note": "ヲ〜", "meaning_en": "undertake, take on; vouch for", "meaning_vi": "nhận làm, đảm nhận; bảo lãnh", "examples": [{"jp_ruby": "<ruby>仕事<rt>しごと</rt></ruby>を<ruby>引<rt>ひ</rt></ruby>き<ruby>受<rt>う</rt></ruby>けた<ruby>以上<rt>いじょう</rt></ruby>、<ruby>最後<rt>さいご</rt></ruby>まで<ruby>責任<rt>せきにん</rt></ruby>を<ruby>持<rt>も</rt></ruby>ってやるべきだ。", "vi": "Đã nhận việc rồi thì phải làm với tinh thần trách nhiệm cho đến cùng."}, {"jp_ruby": "「この<ruby>役<rt>やく</rt></ruby>はぜひあなたに<ruby>引<rt>ひ</rt></ruby>き<ruby>受<rt>う</rt></ruby>けてもらいたい」", "vi": "'Vai diễn này nhất định tôi muốn nhờ anh/chị đảm nhận.'"}, {"jp_ruby": "<ruby>留学生<rt>りゅうがくせい</rt></ruby>の<ruby>身元<rt>みもと</rt></ruby>を<ruby>引<rt>ひ</rt></ruby>き<ruby>受<rt>う</rt></ruby>ける。", "vi": "Bảo lãnh thân phận cho du học sinh."}], "usage": {"collocations": [], "compounds": ["身元引受人"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1060, "section": "Unit 12 動詞C", "kana": "ます", "word": "増す", "form_note": "ガ／ヲ〜", "meaning_en": "increase", "meaning_vi": "tăng lên; tăng thêm, làm tăng", "examples": [{"jp_ruby": "<ruby>現地<rt>げんち</rt></ruby>に<ruby>行<rt>い</rt></ruby>ってさらに<ruby>興味<rt>きょうみ</rt></ruby>が<ruby>増<rt>ま</rt></ruby>した。", "vi": "Đến tận nơi rồi, tôi càng thấy hứng thú hơn."}, {"jp_ruby": "<ruby>車<rt>くるま</rt></ruby>はスピードを<ruby>増<rt>ま</rt></ruby>した。", "vi": "Chiếc xe tăng tốc."}, {"jp_ruby": "<ruby>体重<rt>たいじゅう</rt></ruby>が3キロ<ruby>増<rt>ま</rt></ruby>した。", "vi": "Cân nặng tăng 3 kg."}, {"jp_ruby": "<ruby>台風<rt>たいふう</rt></ruby>で<ruby>川<rt>かわ</rt></ruby>の<ruby>水<rt>みず</rt></ruby>が<ruby>増<rt>ま</rt></ruby>してきた。", "vi": "Do bão, nước sông dâng lên."}, {"jp_ruby": "<ruby>彼<rt>かれ</rt></ruby>は<ruby>新<rt>あたら</rt></ruby>しい<ruby>事業<rt>じぎょう</rt></ruby>に<ruby>投資<rt>とうし</rt></ruby>し、さらに<ruby>財産<rt>ざいさん</rt></ruby>を<ruby>増<rt>ま</rt></ruby>した。", "vi": "Anh ấy đầu tư vào dự án mới và càng làm tăng thêm tài sản."}, {"jp_ruby": "<ruby>台風<rt>たいふう</rt></ruby>は<ruby>勢<rt>いきお</rt></ruby>いを<ruby>増<rt>ま</rt></ruby>した。", "vi": "Cơn bão tăng thêm cường độ."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["減る", "減らす"], "related": [], "synonyms": ["増える", "増やす"]}}, {"no": 1061, "section": "Unit 12 動詞C", "kana": "かける", "word": "欠ける", "form_note": "ガ〜（他動詞形：ヲ欠く）", "meaning_en": "chip; miss; lack", "meaning_vi": "sứt, mẻ; thiếu, khuyết, không đủ", "examples": [{"jp_ruby": "<ruby>茶碗<rt>ちゃわん</rt></ruby>の<ruby>縁<rt>ふち</rt></ruby>が<ruby>欠<rt>か</rt></ruby>けてしまった。", "vi": "Miệng bát bị sứt mất rồi."}, {"jp_ruby": "うちのチームはメンバーが<ruby>少<rt>すく</rt></ruby>ないので、<ruby>一人<rt>ひとり</rt></ruby>でも<ruby>欠<rt>か</rt></ruby>けると、<ruby>試合<rt>しあい</rt></ruby>に<ruby>出<rt>で</rt></ruby>られない。", "vi": "Đội của tôi ít thành viên nên thiếu dù chỉ một người cũng không thể ra sân thi đấu."}, {"jp_ruby": "あの<ruby>人<rt>ひと</rt></ruby>は<ruby>協調性<rt>きょうちょうせい</rt></ruby>に<ruby>欠<rt>か</rt></ruby>ける。", "vi": "Người đó thiếu tinh thần hợp tác."}, {"jp_ruby": "<ruby>社長<rt>しゃちょう</rt></ruby>の<ruby>話<rt>はなし</rt></ruby>は<ruby>一貫性<rt>いっかんせい</rt></ruby>に<ruby>欠<rt>か</rt></ruby>ける。", "vi": "Lời của giám đốc thiếu tính nhất quán."}, {"jp_ruby": "この<ruby>論文<rt>ろんぶん</rt></ruby>は<ruby>一貫性<rt>いっかんせい</rt></ruby>を<ruby>欠<rt>か</rt></ruby>いている。", "vi": "Bài luận này thiếu tính nhất quán. (dạng tha động từ ヲ欠く)"}, {"jp_ruby": "<ruby>義理<rt>ぎり</rt></ruby>を<ruby>欠<rt>か</rt></ruby>く。", "vi": "Thiếu lễ nghĩa, không tròn đạo nghĩa. (dạng tha động từ ヲ欠く)"}], "usage": {"collocations": ["｛歯／びんの口…｝が欠ける"], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1062, "section": "Unit 12 動詞C", "kana": "かかす", "word": "欠かす", "form_note": "ヲ〜", "meaning_en": "lack; miss", "meaning_vi": "thiếu, không thể thiếu; bỏ lỡ, bỏ sót (việc thường làm)", "examples": [{"jp_ruby": "<ruby>骨<rt>ほね</rt></ruby>の<ruby>成長<rt>せいちょう</rt></ruby>にカルシウムは<ruby>欠<rt>か</rt></ruby>かせない。", "vi": "Canxi là thứ không thể thiếu cho sự phát triển của xương."}, {"jp_ruby": "<ruby>兄<rt>あに</rt></ruby>は<ruby>毎朝<rt>まいあさ</rt></ruby>ジョギングを<ruby>欠<rt>か</rt></ruby>かさない。", "vi": "Anh trai tôi không sáng nào bỏ buổi chạy bộ."}, {"jp_ruby": "<ruby>私<rt>わたし</rt></ruby>はこの10<ruby>年間<rt>ねんかん</rt></ruby>、<ruby>毎日欠<rt>まいにちか</rt></ruby>かさず<ruby>日記<rt>にっき</rt></ruby>をつけている。", "vi": "Suốt 10 năm nay, ngày nào tôi cũng viết nhật ký, không bỏ sót ngày nào."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1063, "section": "Unit 12 動詞C", "kana": "すむ", "word": "澄む", "form_note": "ガ〜", "meaning_en": "become clear; clear", "meaning_vi": "trong trẻo, trong veo; (tiếng, mắt) trong, sáng", "examples": [{"jp_ruby": "<ruby>山<rt>やま</rt></ruby>の<ruby>空気<rt>くうき</rt></ruby>は<ruby>澄<rt>す</rt></ruby>んでいる。", "vi": "Không khí trên núi trong trẻo."}], "usage": {"collocations": ["澄んだ｛水／色／目／声／心…｝"], "compounds": ["澄み渡る"], "antonyms": ["濁る"], "related": [], "synonyms": []}}, {"no": 1064, "section": "Unit 12 動詞C", "kana": "にごる", "word": "濁る", "form_note": "ガ〜", "meaning_en": "get muddy, get turbid", "meaning_vi": "đục, vẩn đục", "examples": [{"jp_ruby": "<ruby>台風<rt>たいふう</rt></ruby>で<ruby>濁<rt>にご</rt></ruby>った<ruby>川<rt>かわ</rt></ruby>の<ruby>水<rt>みず</rt></ruby>が<ruby>激<rt>はげ</rt></ruby>しく<ruby>流<rt>なが</rt></ruby>れている。", "vi": "Nước sông đục ngầu vì bão đang chảy xiết."}], "usage": {"collocations": ["濁った｛声／音／目…｝"], "compounds": [], "antonyms": ["澄む"], "related": ["濁り（名）"], "synonyms": []}}, {"no": 1065, "section": "Unit 12 動詞C", "kana": "にごす", "word": "濁す", "form_note": "ヲ〜", "meaning_en": "(speak) ambiguously", "meaning_vi": "nói lấp lửng, nói tránh, nói nước đôi", "examples": [{"jp_ruby": "<ruby>記者<rt>きしゃ</rt></ruby>に<ruby>鋭<rt>するど</rt></ruby>い<ruby>質問<rt>しつもん</rt></ruby>をされた<ruby>政治家<rt>せいじか</rt></ruby>は<ruby>言葉<rt>ことば</rt></ruby>を<ruby>濁<rt>にご</rt></ruby>した。", "vi": "Bị phóng viên đặt câu hỏi sắc bén, chính trị gia đã nói lấp lửng."}, {"jp_ruby": "「<ruby>明日<rt>あした</rt></ruby>の<ruby>予定<rt>よてい</rt></ruby>を<ruby>聞<rt>き</rt></ruby>いたのに、<ruby>彼<rt>かれ</rt></ruby>は<ruby>返事<rt>へんじ</rt></ruby>を<ruby>濁<rt>にご</rt></ruby>した。<ruby>何<rt>なに</rt></ruby>かあるのだろうか」", "vi": "'Tôi hỏi lịch trình ngày mai mà anh ấy trả lời lấp lửng. Chắc có chuyện gì đây.'"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1066, "section": "Unit 12 動詞C", "kana": "しょうじる", "word": "生じる", "form_note": "ガ／ヲ〜（「生ずる」という形もある）", "meaning_en": "occur; cause, generate", "meaning_vi": "phát sinh, nảy sinh; gây ra, sinh ra", "examples": [{"jp_ruby": "<ruby>計画<rt>けいかく</rt></ruby>の<ruby>途中<rt>とちゅう</rt></ruby>で<ruby>問題<rt>もんだい</rt></ruby>が<ruby>生<rt>しょう</rt></ruby>じた。", "vi": "Giữa chừng kế hoạch đã phát sinh vấn đề."}, {"jp_ruby": "<ruby>両者<rt>りょうしゃ</rt></ruby>に<ruby>差<rt>さ</rt></ruby>が<ruby>生<rt>しょう</rt></ruby>じた。", "vi": "Giữa hai bên đã nảy sinh sự chênh lệch."}, {"jp_ruby": "この<ruby>情報<rt>じょうほう</rt></ruby>が<ruby>広<rt>ひろ</rt></ruby>まると<ruby>社会<rt>しゃかい</rt></ruby>に<ruby>混乱<rt>こんらん</rt></ruby>｛が／を｝<ruby>生<rt>しょう</rt></ruby>じる<ruby>恐<rt>おそ</rt></ruby>れがある。", "vi": "Nếu thông tin này lan rộng, có nguy cơ gây ra hỗn loạn trong xã hội."}, {"jp_ruby": "<ruby>金属<rt>きんぞく</rt></ruby>にさびが<ruby>生<rt>しょう</rt></ruby>じる。", "vi": "Kim loại bị phát sinh gỉ sét."}, {"jp_ruby": "<ruby>摩擦<rt>まさつ</rt></ruby>によって<ruby>熱<rt>ねつ</rt></ruby>が<ruby>生<rt>しょう</rt></ruby>じる。", "vi": "Do ma sát mà sinh ra nhiệt."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": ["生まれる", "発生する"], "synonyms": []}}, {"no": 1067, "section": "Unit 12 動詞C", "kana": "およぶ", "word": "及ぶ", "form_note": "ガ〜", "meaning_en": "extend, reach, be equal to; do not need", "meaning_vi": "kéo dài tới, lan tới; sánh bằng, bì kịp; không cần (đến mức phải làm)", "examples": [{"jp_ruby": "<ruby>台風<rt>たいふう</rt></ruby>の<ruby>被害<rt>ひがい</rt></ruby>は、<ruby>九州地方全域<rt>きゅうしゅうちほうぜんいき</rt></ruby>に<ruby>及<rt>およ</rt></ruby>んだ。", "vi": "Thiệt hại do bão đã lan rộng khắp toàn vùng Kyushu."}, {"jp_ruby": "<ruby>手術<rt>しゅじゅつ</rt></ruby>は5<ruby>時間<rt>じかん</rt></ruby>に<ruby>及<rt>およ</rt></ruby>んだ。", "vi": "Ca phẫu thuật kéo dài tới 5 tiếng đồng hồ."}, {"jp_ruby": "<ruby>今回<rt>こんかい</rt></ruby>の<ruby>優勝<rt>ゆうしょう</rt></ruby>タイムは<ruby>日本記録<rt>にほんきろく</rt></ruby>に<ruby>及<rt>およ</rt></ruby>ばなかった。", "vi": "Thành tích vô địch lần này không đạt tới kỷ lục Nhật Bản."}, {"jp_ruby": "がんばったが、<ruby>力及<rt>ちからおよ</rt></ruby>ばず<ruby>負<rt>ま</rt></ruby>けてしまった。", "vi": "Đã cố gắng nhưng sức không bì kịp nên đã thua."}, {"jp_ruby": "「たいした<ruby>病気<rt>びょうき</rt></ruby>ではないので、ご<ruby>心配<rt>しんぱい</rt></ruby>には<ruby>及<rt>およ</rt></ruby>びません」", "vi": "'Không phải bệnh gì nghiêm trọng nên xin anh/chị không cần phải lo lắng.'"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1068, "section": "Unit 12 動詞C", "kana": "およぼす", "word": "及ぼす", "form_note": "ヲ〜", "meaning_en": "exert, affect", "meaning_vi": "gây ra (ảnh hưởng, thiệt hại), tác động tới", "examples": [{"jp_ruby": "<ruby>彼<rt>かれ</rt></ruby>らの<ruby>音楽<rt>おんがく</rt></ruby>は<ruby>若者<rt>わかもの</rt></ruby>に<ruby>大<rt>おお</rt></ruby>きな<ruby>影響<rt>えいきょう</rt></ruby>を<ruby>及<rt>およ</rt></ruby>ぼした。", "vi": "Âm nhạc của họ đã ảnh hưởng lớn đến giới trẻ."}, {"jp_ruby": "その<ruby>地震<rt>じしん</rt></ruby>は<ruby>大<rt>おお</rt></ruby>きな<ruby>被害<rt>ひがい</rt></ruby>を<ruby>及<rt>およ</rt></ruby>ぼした。", "vi": "Trận động đất đó đã gây ra thiệt hại lớn."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["与える", "もたらす"]}}, {"no": 1069, "section": "Unit 12 動詞C", "kana": "いたる", "word": "至る", "form_note": "ガ〜", "meaning_en": "lead to; (from ~) to ~; come to", "meaning_vi": "dẫn tới; (từ ~) cho đến ~; đến mức, dẫn đến (kết quả)", "examples": [{"jp_ruby": "<ruby>山頂<rt>さんちょう</rt></ruby>に<ruby>至<rt>いた</rt></ruby>る<ruby>道<rt>みち</rt></ruby>。", "vi": "Con đường dẫn lên đỉnh núi."}, {"jp_ruby": "（<ruby>履歴書<rt>りれきしょ</rt></ruby>）「<ruby>銀行勤務<rt>ぎんこうきんむ</rt></ruby>を<ruby>経<rt>へ</rt></ruby>て<ruby>現在<rt>げんざい</rt></ruby>に<ruby>至<rt>いた</rt></ruby>る」", "vi": "(Trong sơ yếu lý lịch) 'Sau thời gian làm việc tại ngân hàng, cho đến nay.'"}, {"jp_ruby": "<ruby>娘<rt>むすめ</rt></ruby>は<ruby>三日<rt>みっか</rt></ruby><ruby>前<rt>まえ</rt></ruby>に<ruby>家<rt>いえ</rt></ruby>を<ruby>出<rt>で</rt></ruby>たきり、<ruby>今<rt>いま</rt></ruby>に<ruby>至<rt>いた</rt></ruby>るまで<ruby>連絡<rt>れんらく</rt></ruby>がない。", "vi": "Con gái tôi ra khỏi nhà ba ngày trước, rồi từ đó đến nay không có liên lạc gì."}, {"jp_ruby": "この<ruby>歌<rt>うた</rt></ruby>は<ruby>若者<rt>わかもの</rt></ruby>からお<ruby>年寄<rt>としよ</rt></ruby>りに<ruby>至<rt>いた</rt></ruby>るまで、<ruby>幅広<rt>はばひろ</rt></ruby>い<ruby>世代<rt>せだい</rt></ruby>に<ruby>受<rt>う</rt></ruby>け<ruby>入<rt>い</rt></ruby>れられている。", "vi": "Bài hát này được đón nhận bởi nhiều thế hệ, từ người trẻ cho đến người già."}, {"jp_ruby": "にわか<ruby>雨<rt>あめ</rt></ruby>に<ruby>降<rt>ふ</rt></ruby>られ、<ruby>頭<rt>あたま</rt></ruby>の<ruby>先<rt>さき</rt></ruby>からつま<ruby>先<rt>さき</rt></ruby>に<ruby>至<rt>いた</rt></ruby>るまで、ずぶぬれになってしまった。", "vi": "Bị cơn mưa rào bất chợt, tôi ướt sũng từ đầu đến chân."}, {"jp_ruby": "<ruby>至<rt>いた</rt></ruby>る<ruby>所<rt>ところ</rt></ruby>にごみが<ruby>落<rt>お</rt></ruby>ちていて<ruby>汚<rt>きたな</rt></ruby>い。", "vi": "Khắp nơi đều có rác rơi vãi, bẩn thỉu."}, {"jp_ruby": "その<ruby>人<rt>ひと</rt></ruby>は3カ<ruby>月休<rt>げつやす</rt></ruby>まずに<ruby>働<rt>はたら</rt></ruby>き<ruby>続<rt>つづ</rt></ruby>け、ついに<ruby>過労死<rt>かろうし</rt></ruby>するに<ruby>至<rt>いた</rt></ruby>った。", "vi": "Người đó làm việc liên tục 3 tháng không nghỉ, cuối cùng dẫn đến tử vong do làm việc quá sức."}, {"jp_ruby": "<ruby>犯人<rt>はんにん</rt></ruby>が<ruby>犯行<rt>はんこう</rt></ruby>に<ruby>至<rt>いた</rt></ruby>った<ruby>経緯<rt>けいい</rt></ruby>は<ruby>次<rt>つぎ</rt></ruby>のとおりです。", "vi": "Diễn biến dẫn đến việc hung thủ gây án như sau."}], "usage": {"collocations": ["至る所"], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1070, "section": "Unit 12 動詞C", "kana": "たっする", "word": "達する", "form_note": "ガ／ヲ〜", "meaning_en": "reach, arrive at", "meaning_vi": "đạt tới, chạm tới (mức, đích, giới hạn)", "examples": [{"jp_ruby": "5<ruby>時間登<rt>じかんのぼ</rt></ruby>って<ruby>山頂<rt>さんちょう</rt></ruby>に<ruby>達<rt>たっ</rt></ruby>した。", "vi": "Leo suốt 5 tiếng đồng hồ thì tới đỉnh núi."}, {"jp_ruby": "<ruby>目的地<rt>もくてきち</rt></ruby>に<ruby>達<rt>たっ</rt></ruby>する。", "vi": "Đến được nơi cần đến."}, {"jp_ruby": "<ruby>売上高<rt>うりあげだか</rt></ruby>が<ruby>目標<rt>もくひょう</rt></ruby>に<ruby>達<rt>たっ</rt></ruby>した。", "vi": "Doanh số đã đạt mục tiêu."}, {"jp_ruby": "<ruby>今日<rt>きょう</rt></ruby>までの<ruby>入場者<rt>にゅうじょうしゃ</rt></ruby>が100<ruby>万人<rt>まんにん</rt></ruby>に<ruby>達<rt>たっ</rt></ruby>した。", "vi": "Số người vào cửa tính đến hôm nay đã đạt 1 triệu người."}, {"jp_ruby": "<ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>いが<ruby>結論<rt>けつろん</rt></ruby>に<ruby>達<rt>たっ</rt></ruby>した。", "vi": "Cuộc thảo luận đã đi đến kết luận."}, {"jp_ruby": "<ruby>今<rt>いま</rt></ruby>の<ruby>学力<rt>がくりょく</rt></ruby>では<ruby>合格<rt>ごうかく</rt></ruby>ラインに<ruby>達<rt>たっ</rt></ruby>しない。", "vi": "Với học lực hiện tại thì không đạt tới mức điểm đỗ."}, {"jp_ruby": "<ruby>目的<rt>もくてき</rt></ruby>を<ruby>達<rt>たっ</rt></ruby>する。", "vi": "Đạt được mục đích."}], "usage": {"collocations": ["｛疲労／ストレス／我慢…｝が限界に達した"], "compounds": [], "antonyms": [], "related": [], "synonyms": ["到達する", "至る", "届く", "遂げる", "達成する"]}}, {"no": 1071, "section": "Unit 12 動詞C", "kana": "みのる", "word": "実る", "form_note": "ガ〜", "meaning_en": "bear (fruit); produce good results", "meaning_vi": "kết trái, chín (cây trái); đạt được kết quả tốt (nỗ lực)", "examples": [{"jp_ruby": "<ruby>今年<rt>ことし</rt></ruby>は<ruby>稲<rt>いね</rt></ruby>がよく<ruby>実<rt>みの</rt></ruby>っている。", "vi": "Năm nay lúa trổ bông, chín tốt."}, {"jp_ruby": "この<ruby>地方<rt>ちほう</rt></ruby>ではリンゴは<ruby>実<rt>みの</rt></ruby>らない。", "vi": "Ở vùng này, táo không ra quả được."}, {"jp_ruby": "<ruby>長年<rt>ながねん</rt></ruby>の<ruby>努力<rt>どりょく</rt></ruby>が<ruby>実<rt>みの</rt></ruby>った。", "vi": "Nỗ lực bao nhiêu năm đã đơm hoa kết trái."}, {"jp_ruby": "<ruby>我々<rt>われわれ</rt></ruby>の<ruby>研究<rt>けんきゅう</rt></ruby>は<ruby>結局実<rt>けっきょくみの</rt></ruby>らなかった。", "vi": "Nghiên cứu của chúng tôi cuối cùng đã không đạt được kết quả."}, {"jp_ruby": "<ruby>実<rt>みの</rt></ruby>りの<ruby>秋<rt>あき</rt></ruby>。", "vi": "Mùa thu bội thu (mùa gặt hái). (ví dụ của danh từ 実り)"}, {"jp_ruby": "<ruby>今度<rt>こんど</rt></ruby>の<ruby>研修会<rt>けんしゅうかい</rt></ruby>は<ruby>実<rt>みの</rt></ruby>り<ruby>多<rt>おお</rt></ruby>いものだった。", "vi": "Buổi tập huấn lần này thu được rất nhiều kết quả. (ví dụ của danh từ 実り)"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": ["なる", "実り（名）"], "synonyms": []}}, {"no": 1072, "section": "Unit 12 動詞C", "kana": "くれる", "word": "暮れる", "form_note": "ガ〜", "meaning_en": "get dark, come to an end, be at a loss", "meaning_vi": "(trời) tối sầm, ngày tàn; (năm) sắp hết; bối rối, không biết làm sao", "examples": [{"jp_ruby": "<ruby>冬<rt>ふゆ</rt></ruby>は<ruby>日<rt>ひ</rt></ruby>が<ruby>早<rt>はや</rt></ruby>く<ruby>暮<rt>く</rt></ruby>れる。", "vi": "Mùa đông trời tối nhanh."}, {"jp_ruby": "<ruby>間<rt>ま</rt></ruby>もなく<ruby>年<rt>とし</rt></ruby>が<ruby>暮<rt>く</rt></ruby>れる。", "vi": "Chẳng bao lâu nữa năm cũ sẽ hết (sang năm mới)."}, {"jp_ruby": "<ruby>知人<rt>ちじん</rt></ruby>もいない<ruby>外国<rt>がいこく</rt></ruby>ですりかばん（？）をすられ、<ruby>途方<rt>とほう</rt></ruby>に<ruby>暮<rt>く</rt></ruby>れた。", "vi": "Ở nước ngoài không quen biết ai, lại bị móc túi lấy mất cặp, tôi bối rối không biết làm sao. (ví dụ của quán ngữ 途方に暮れる)"}], "usage": {"collocations": ["途方に暮れる"], "compounds": ["日暮れ", "夕暮れ"], "antonyms": ["明ける"], "related": ["暮れ（名）"], "synonyms": []}}, {"no": 1073, "section": "Unit 12 動詞C", "kana": "おとる", "word": "劣る", "form_note": "ガ〜", "meaning_en": "be inferior (to ~)", "meaning_vi": "kém hơn, thua kém (so với ~)", "examples": [{"jp_ruby": "ベテランのA<ruby>選手<rt>せんしゅ</rt></ruby>は<ruby>体力<rt>たいりょく</rt></ruby>ではB<ruby>選手<rt>せんしゅ</rt></ruby>｛に／より｝<ruby>劣<rt>おと</rt></ruby>るが、テクニックで<ruby>勝<rt>まさ</rt></ruby>てるだろう。", "vi": "Tuyển thủ kỳ cựu A về thể lực thì kém tuyển thủ B, nhưng có lẽ sẽ thắng nhờ kỹ thuật."}, {"jp_ruby": "子どもに<ruby>劣<rt>おと</rt></ruby>らず<ruby>大人<rt>おとな</rt></ruby>も、このゲームに<ruby>夢中<rt>むちゅう</rt></ruby>になっている。", "vi": "Không thua kém trẻ con, người lớn cũng đang mê mẩn trò chơi này."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["勝る"], "related": [], "synonyms": []}}, {"no": 1074, "section": "Unit 12 動詞C", "kana": "ことなる", "word": "異なる", "form_note": "ガ〜（「違う」より書き言葉的）", "meaning_en": "differ", "meaning_vi": "khác nhau, khác biệt", "examples": [{"jp_ruby": "<ruby>私<rt>わたし</rt></ruby>はあの<ruby>人<rt>ひと</rt></ruby>と<ruby>意見<rt>いけん</rt></ruby>が<ruby>異<rt>こと</rt></ruby>なる。", "vi": "Tôi có ý kiến khác với người đó."}, {"jp_ruby": "うわさは<ruby>事実<rt>じじつ</rt></ruby>と<ruby>異<rt>こと</rt></ruby>なっていることが<ruby>多<rt>おお</rt></ruby>い。", "vi": "Tin đồn thường khác với sự thật."}, {"jp_ruby": "<ruby>機能<rt>きのう</rt></ruby>の<ruby>異<rt>こと</rt></ruby>なる<ruby>三<rt>みっ</rt></ruby>つの<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>のうち、どれを<ruby>買<rt>か</rt></ruby>おうかと<ruby>迷<rt>まよ</rt></ruby>っている。", "vi": "Trong ba chiếc điện thoại di động khác nhau về chức năng, tôi đang phân vân không biết nên mua cái nào."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["同じ"], "related": [], "synonyms": ["違う"]}}, {"no": 1075, "section": "Unit 12 動詞C", "kana": "みだれる", "word": "乱れる", "form_note": "ガ〜", "meaning_en": "fall into disorder, be confused", "meaning_vi": "rối loạn, xáo trộn, mất trật tự; (tâm trí) rối bời", "examples": [{"jp_ruby": "<ruby>風<rt>かぜ</rt></ruby>で<ruby>髪<rt>かみ</rt></ruby>が<ruby>乱<rt>みだ</rt></ruby>れた。", "vi": "Tóc bị gió thổi rối."}, {"jp_ruby": "<ruby>人身事故<rt>じんしんじこ</rt></ruby>のため、<ruby>電車<rt>でんしゃ</rt></ruby>のダイヤが<ruby>乱<rt>みだ</rt></ruby>れている。", "vi": "Do tai nạn có người thương vong, lịch trình tàu điện đang bị xáo trộn."}, {"jp_ruby": "<ruby>彼<rt>かれ</rt></ruby>はお<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んでも<ruby>乱<rt>みだ</rt></ruby>れない。", "vi": "Anh ấy dù uống rượu cũng không mất kiểm soát, không loạn."}, {"jp_ruby": "<ruby>昔<rt>むかし</rt></ruby>の<ruby>恋人<rt>こいびと</rt></ruby>に<ruby>再会<rt>さいかい</rt></ruby>して<ruby>心<rt>こころ</rt></ruby>が<ruby>乱<rt>みだ</rt></ruby>れた。", "vi": "Gặp lại người yêu cũ, lòng tôi rối bời xao xuyến."}], "usage": {"collocations": ["｛列／服装／風紀／ペース…｝が乱れる"], "compounds": [], "antonyms": [], "related": ["乱雑な", "崩れる", "乱れ（名）"], "synonyms": []}}, {"no": 1076, "section": "Unit 12 動詞C", "kana": "みだす", "word": "乱す", "form_note": "ヲ〜", "meaning_en": "disturb, put ~ into confusion", "meaning_vi": "làm rối loạn, phá vỡ (trật tự, nhịp điệu)", "examples": [{"jp_ruby": "<ruby>新人選手<rt>しんじんせんしゅ</rt></ruby>は<ruby>後半<rt>こうはん</rt></ruby>ペースを<ruby>乱<rt>みだ</rt></ruby>して、<ruby>負<rt>ま</rt></ruby>けてしまった。", "vi": "Tuyển thủ mới ở hiệp sau bị rối nhịp thi đấu nên đã thua."}, {"jp_ruby": "その<ruby>知<rt>し</rt></ruby>らせは<ruby>彼女<rt>かのじょ</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>を<ruby>乱<rt>みだ</rt></ruby>した。", "vi": "Tin tức đó đã làm lòng cô ấy rối bời."}], "usage": {"collocations": ["｛秩序／風紀／髪／列…｝を乱す"], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1077, "section": "Unit 12 動詞C", "kana": "ゆるむ", "word": "緩む", "form_note": "ガ〜", "meaning_en": "loosen; get relaxed; break; abate", "meaning_vi": "lỏng ra, nới lỏng; chùng xuống, thư giãn; (nền đất) yếu đi; (cái lạnh) dịu bớt", "examples": [{"jp_ruby": "<ruby>靴<rt>くつ</rt></ruby>ひもが<ruby>緩<rt>ゆる</rt></ruby>んで、<ruby>靴<rt>くつ</rt></ruby>が<ruby>脱<rt>ぬ</rt></ruby>げてしまった。", "vi": "Dây giày lỏng ra, giày bị tuột mất."}, {"jp_ruby": "<ruby>試験<rt>しけん</rt></ruby>が<ruby>終<rt>お</rt></ruby>わったら<ruby>気<rt>き</rt></ruby>が<ruby>緩<rt>ゆる</rt></ruby>んで、<ruby>風邪<rt>かぜ</rt></ruby>をひいてしまった。", "vi": "Thi xong, tinh thần chùng xuống thư giãn, thế là bị cảm."}, {"jp_ruby": "<ruby>雨<rt>あめ</rt></ruby>で<ruby>地盤<rt>じばん</rt></ruby>が<ruby>緩<rt>ゆる</rt></ruby>み、<ruby>土砂崩<rt>どしゃくず</rt></ruby>れが<ruby>起<rt>お</rt></ruby>こる<ruby>危険<rt>  "<ruby>今日<rt>きょう</rt></ruby>のお<ruby>祭<rt>まつ</rt></ruby>りには、ざっと3,000<ruby>人<rt>にん</rt></ruby>ほどが<ruby>参加<rt>さんか</rt></ruby>した。", "vi": "Lễ hội hôm nay có khoảng chừng 3.000 người tham gia."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["大まかに", "大ざっぱに", "およそ", "ほぼ"]}}, {"no": 1126, "section": "Unit 13 副詞B＋連体詞", "kana": "こっそり", "word": "こっそり", "form_note": "", "meaning_en": "secretly", "meaning_vi": "lén lút, bí mật, trộm", "examples": [{"jp_ruby": "<ruby>先生<rt>せんせい</rt></ruby>に<ruby>見<rt>み</rt></ruby>つからないように、こっそりケータイのメールを<ruby>見<rt>み</rt></ruby>た。", "vi": "Để thầy giáo không phát hiện, tôi lén xem tin nhắn trên điện thoại."}, {"jp_ruby": "「あなたにだけこっそり<ruby>教<rt>おし</rt></ruby>えてあげる」", "vi": "「Tớ chỉ bí mật nói cho mình cậu biết thôi đấy.」"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1127, "section": "Unit 13 副詞B＋連体詞", "kana": "いきいき（と）", "word": "生き生き（と）", "form_note": "生き生き（ト）スル", "meaning_en": "lively, vividly", "meaning_vi": "sống động, tràn đầy sức sống", "examples": [{"jp_ruby": "<ruby>彼女<rt>かのじょ</rt></ruby>はいきいきと<ruby>働<rt>はたら</rt></ruby>いている。", "vi": "Cô ấy làm việc đầy sức sống."}, {"jp_ruby": "<ruby>子<rt>こ</rt></ruby>どもたちのいきいき（と）した<ruby>表情<rt>ひょうじょう</rt></ruby>が<ruby>印象的<rt>いんしょうてき</rt></ruby>だった。", "vi": "Vẻ mặt tươi tắn, đầy sức sống của bọn trẻ để lại ấn tượng sâu sắc."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1128, "section": "Unit 13 副詞B＋連体詞", "kana": "ぼんやり（と）", "word": "ぼんやり（と）", "form_note": "ぼんやりスル", "meaning_en": "dimly; vaguely; absent-mindedly", "meaning_vi": "mờ mờ, lờ mờ; mơ hồ, không rõ; lơ đãng, đầu óc lơ mơ", "examples": [{"jp_ruby": "<ruby>霧<rt>きり</rt></ruby>の<ruby>中<rt>なか</rt></ruby>に、ぼんやり<ruby>船<rt>ふね</rt></ruby>が<ruby>見<rt>み</rt></ruby>えた。", "vi": "Trong sương mù, thấy lờ mờ một con thuyền."}, {"jp_ruby": "<ruby>暗<rt>くら</rt></ruby>くて、ぼんやりとしか<ruby>見<rt>み</rt></ruby>えなかった。", "vi": "Trời tối nên chỉ nhìn thấy lờ mờ."}, {"jp_ruby": "<ruby>昔<rt>むかし</rt></ruby>のことなので、ぼんやりとしか<ruby>覚<rt>おぼ</rt></ruby>えていない。", "vi": "Vì là chuyện ngày xưa nên tôi chỉ nhớ mơ hồ."}, {"jp_ruby": "<ruby>熱<rt>ねつ</rt></ruby>で<ruby>頭<rt>あたま</rt></ruby>がぼんやりしている。", "vi": "Vì sốt nên đầu óc tôi lơ mơ."}, {"jp_ruby": "ぼんやり<ruby>歩<rt>ある</rt></ruby>いていて、<ruby>人<rt>ひと</rt></ruby>にぶつかってしまった。", "vi": "Tôi đi mà đầu óc lơ đãng nên đã va vào người khác."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["はっきり（と）スル"], "related": [], "synonyms": []}}, {"no": 1129, "section": "Unit 13 副詞B＋連体詞", "kana": "ふと", "word": "ふと", "form_note": "", "meaning_en": "suddenly, by chance", "meaning_vi": "bất chợt, chợt (nảy ra/nhận ra)", "examples": [{"jp_ruby": "ふと<ruby>窓<rt>まど</rt></ruby>の<ruby>外<rt>そと</rt></ruby>を<ruby>見<rt>み</rt></ruby>ると、<ruby>雪<rt>ゆき</rt></ruby>が<ruby>降<rt>ふ</rt></ruby>っていた。", "vi": "Bất chợt nhìn ra ngoài cửa sổ thì thấy tuyết đang rơi."}, {"jp_ruby": "ふとしたことから<ruby>星<rt>ほし</rt></ruby>に<ruby>興味<rt>きょうみ</rt></ruby>を<ruby>持<rt>も</rt></ruby>つようになった。", "vi": "Từ một chuyện tình cờ, tôi bắt đầu có hứng thú với các vì sao."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1130, "section": "Unit 13 副詞B＋連体詞", "kana": "じかに", "word": "じかに", "form_note": "", "meaning_en": "directly; at first hand", "meaning_vi": "trực tiếp; tận tay, tận nơi (không qua trung gian)", "examples": [{"jp_ruby": "<ruby>何<rt>なに</rt></ruby>も<ruby>敷<rt>し</rt></ruby>かないで、じかに<ruby>地面<rt>じめん</rt></ruby>に<ruby>座<rt>すわ</rt></ruby>った。", "vi": "Không trải gì cả, tôi ngồi trực tiếp xuống mặt đất."}, {"jp_ruby": "<ruby>社長<rt>しゃちょう</rt></ruby>とじかに<ruby>話<rt>はな</rt></ruby>す<ruby>機会<rt>きかい</rt></ruby>があった。", "vi": "Tôi đã có cơ hội nói chuyện trực tiếp với giám đốc."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["直接"]}}, {"no": 1131, "section": "Unit 13 副詞B＋連体詞", "kana": "いちどに", "word": "一度に", "for ruby>まれた。<ruby>母子<rt>ぼし</rt></ruby>ともに<ruby>順調<rt>じゅんちょう</rt></ruby>だ。", "vi": "Em bé đã chào đời. Cả mẹ và bé đều khỏe."}, {"jp_ruby": "<ruby>娘<rt>むすめ</rt></ruby>が<ruby>結婚<rt>けっこん</rt></ruby>した。うれしいとともに<ruby>寂<rt>さび</rt></ruby>しくもある。", "vi": "Con gái tôi kết hôn. Vui mừng nhưng đồng thời cũng thấy trống vắng."}, {"jp_ruby": "<ruby>梅雨<rt>つゆ</rt></ruby>が<ruby>明<rt>あ</rt></ruby>けるとともに、<ruby>気温<rt>きおん</rt></ruby>が<ruby>急<rt>きゅう</rt></ruby>に<ruby>高<rt>たか</rt></ruby>くなった。", "vi": "Mùa mưa kết thúc, đồng thời nhiệt độ cũng tăng vọt."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["いっしょに", "同時に"]}}, {"no": 1134, "section": "Unit 13 副詞B＋連体詞", "kana": "そうごに", "word": "相互に", "form_note": "", "meaning_en": "mutually; each other", "meaning_vi": "lẫn nhau, qua lại hai chiều", "examples": [{"jp_ruby": "よく<ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>って、<ruby>相互<rt>そうご</rt></ruby>に<ruby>理解<rt>りかい</rt></ruby>し<ruby>合<rt>あ</rt></ruby>うことが<ruby>大切<rt>たいせつ</rt></ruby>だ。", "vi": "Điều quan trọng là trao đổi kỹ càng và hiểu lẫn nhau."}], "usage": {"collocations": [], "compounds": ["相互理解"], "antonyms": [], "related": [], "synonyms": ["互いに（☞ N3 854）"]}}, {"no": 1135, "section": "Unit 13 副詞B＋連体詞", "kana": "ひとりひとり", "word": "一人一人", "form_note": "", "meaning_en": "individually, one by one", "meaning_vi": "từng người một, mỗi cá nhân", "examples": [{"jp_ruby": "<ruby>出席者<rt>しゅっせきしゃ</rt></ruby>は<ruby>一人一人<rt>ひとりひとり</rt></ruby><ruby>意見<rt>いけん</rt></ruby>を<ruby>述<rt>の</rt></ruby>べた。", "vi": "Những người tham dự lần lượt từng người trình bày ý kiến."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["めいめい", "それぞれ（☞ N3 853）"]}}, {"no": 1136, "section": "Unit 13 副詞B＋連体詞", "kana": "いちいち", "word": "いちいち", "form_note": "", "meaning_en": "everything, one by one, in detail", "meaning_vi": "từng li từng tí, chuyện gì cũng (xen vào/cằn nhằn)", "examples": [{"jp_ruby": "<ruby>母<rt>はは</rt></ruby>は<ruby>私<rt>わたし</r const UNITS = ["Unit 01 名詞A", "Unit 02 動詞A", "Unit 03 形容詞A", "Unit 04 名詞B", "まとめ1 複合動詞", "Unit 05 カタカナA", "Unit 06 副詞A＋接続詞", "Unit 07 名詞C", "まとめ2", "Unit 08 動詞B", "Unit 09 カタカナB", "Unit 10 形容詞B", "Unit 11 名詞D", "Unit 12 動詞C", "Unit 13 副詞B＋連体詞"];
const sel = document.getElementById('unit');
UNITS.forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;sel.appendChild(o);});
let filtered = DATA, shown = 0; const PAGE = 40;
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function usage(u){
  const L=[['collocations','連 Cụm hay đi kèm'],['compounds','合 Từ ghép'],['antonyms','対 Trái nghĩa'],['related','関 Liên quan'],['synonyms','類 Đồng nghĩa']];
  return L.filter(([k])=>u&&u[k]&&u[k].length).map(([k,l])=>`<div class="u"><b>${l}:</b> ${u[k].map(esc).join('、')}</div>`).join('');
}
function card(e){
  const ex = e.examples.map(x=>`<div class="ex"><div class="jp">${x.jp_ruby}</div><div class="vj">${esc(x.vi)}</div></div>`).join('');
  return `<div class="card"><span class="sec">${esc(e.section)}</span><span class="no">No.${e.no}</span>
  <div><span class="word">${esc(e.word)}</span><span class="kana">${esc(e.kana)}</span>${e.form_note?`<span class="fn"> ${esc(e.form_note)}</span>`:''}</div>
  <div class="vi">${esc(e.meaning_vi)}</div><div class="en">${esc(e.meaning_en)}</div>${ex}${usage(e.usage)}</div>`;
}
function render(reset){
  const list=document.getElementById('list');
  if(reset){list.innerHTML='';shown=0;}
  const next=filtered.slice(shown,shown+PAGE);
  list.insertAdjacentHTML('beforeend',next.map(card).join(''));
  shown+=next.length;
  document.getElementById('count').textContent=`Hiển thị ${shown}/${filtered.length} từ`;
  document.getElementById('more').style.display= shown<filtered.length?'block':'none';
}
function apply(){
  const q=document.getElementById('q').value.trim().toLowerCase(), u=sel.value;
  filtered=DATA.filter(e=>(!u||e.section===u)&&(!q||(e.word+' '+e.kana+' '+e.meaning_vi+' '+e.meaning_en+' '+e.no).toLowerCase().includes(q)));
  render(true);
}
document.getElementById('q').addEventListener('input',apply);
sel.addEventListener('change',apply);
document.getElementById('more').addEventListener('click',()=>render(false));
render(true);
