t>こう</rt></ruby>の<ruby>校則<rt>こうそく</rt></ruby>はきつい。", "vi": "Nội quy trường tôi rất nghiêm khắc."}, {"jp_ruby": "きつい｛タバコ／<ruby>酒<rt>さけ</rt></ruby>／におい …｝", "vi": "{Thuốc lá / rượu / mùi ...} nồng, nặng."}, {"jp_ruby": "家の前の<ruby>坂<rt>さか</rt></ruby>は<ruby>傾斜<rt>けいしゃ</rt></ruby>がきつい。", "vi": "Con dốc trước nhà tôi có độ nghiêng rất gắt (dốc đứng)."}, {"jp_ruby": "「<ruby>君<rt>きみ</rt></ruby>は<ruby>冗談<rt>じょうだん</rt></ruby>がきついよ」", "vi": "「Cậu đùa hơi quá (thô) đấy nhé」"}, {"jp_ruby": "彼女は<ruby>優<rt>やさ</rt></ruby>しそうだが、性格はきつい。", "vi": "Cô ấy trông có vẻ hiền lành nhưng tính cách lại khá cứng rắn."}], "usage": {"collocations": [], "compounds": ["きつさ"], "antonyms": ["緩い（ゆるい）"], "related": [], "synonyms": ["固い（かたい）", "辛い（つらい）", "苦しい（くるしい）", "厳しい（きびしい）"]}}, {"no": 258, "section": "Unit 03 形容詞A", "kana": "ゆるい", "word": "緩い", "form_note": "", "meaning_en": "loose; slow; slack", "meaning_vi": "lỏng, rộng; chậm rãi; thoai thoải (dốc, đường cong)", "examples": [{"jp_ruby": "やせてスカートがゆるくなった。", "vi": "Vì gầy đi nên váy trở nên rộng (lỏng)."}, {"jp_ruby": "<ruby>靴<rt>くつ</rt></ruby>のひもがゆるくて、ほどけてしまった。", "vi": "Dây giày bị lỏng nên đã tuột ra."}, {"jp_ruby": "「この道をまっすぐ行くと、ゆるいカーブがあります」", "vi": "「Đi thẳng theo con đường này sẽ có một khúc cua thoai thoải」"}], "usage": {"collocations": [], "compounds": ["緩さ（ゆるさ）"], "antonyms": ["きつい", "急な（きゅうな）"], "related": [], "synonyms": ["緩やかな（ゆるやかな）"]}}, {"no": 259, "section": "Unit 03 形容詞A", "kana": "にぶい", "word": "鈍い", "form_note": "", "meaning_en": "dull; slow; slow (reflexes); have fewer (customers); dim", "meaning_vi": "cùn; chậm chạp; (phản xạ, trực giác) kém nhạy; vắng (khách); mờ, xỉn", "examples": [{"jp_ruby": "このナイフは<ruby>切<rt>き</rt></ruby>れ<ruby>味<rt>あじ</rt></ruby>がにぶい。", "vi": "Con dao này cắt rất cùn (không sắc)."}, {"jp_ruby": "<ruby>佐藤選手<rt>さとうせんしゅ</rt></ruby>は、今日は動きがにぶい。", "vi": "Hôm nay vận động viên Satō di chuyển (phản ứng) rất chậm chạp."}, {"jp_ruby": "｛<ruby>勘<rt>かん</rt></ruby>／<ruby>運動神経<rt>うんどうしんけい</rt></ruby> …｝がにぶい。", "vi": "{Tr </ruby>が<ruby>荒<rt>あら</rt></ruby>い。", "vi": "Biển Nhật Bản vào mùa đông sóng rất dữ."}, {"jp_ruby": "このセーターは<ruby>編<rt>あ</rt></ruby>み<ruby>目<rt>め</rt></ruby>が<ruby>粗<rt>あら</rt></ruby>い", "vi": "Chiếc áo len này có mũi đan thô (thưa)."}, {"jp_ruby": "きめの<ruby>粗<rt>あら</rt></ruby>い<ruby>肌<rt>はだ</rt></ruby>", "vi": "Làn da có kết cấu thô, sần sùi."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["穏やかな（おだやかな）", "細かい（こまかい）"], "related": ["荒っぽい（あらっぽい）", "荒々しい（あらあらしい）"], "synonyms": ["激しい（はげしい）"]}}, {"no": 262, "section": "Unit 03 形容詞A", "kana": "ごういんな", "word": "強引な", "form_note": "", "meaning_en": "forcible", "meaning_vi": "cưỡng ép, áp đặt, ngang ngược", "examples": [{"jp_ruby": "<ruby>与党<rt>よとう</rt></ruby>は<ruby>国会<rt>こっかい</rt></ruby>で<ruby>強引<rt>ごういん</rt></ruby>に<ruby>法案<rt>ほうあん</rt></ruby>を通した。", "vi": "Đảng cầm quyền đã cưỡng ép thông qua dự luật tại Quốc hội."}, {"jp_ruby": "<ruby>強引<rt>ごういん</rt></ruby>な｛人／性格／態度／やり方 …｝", "vi": "{Người / tính cách / thái độ / cách làm ...} áp đặt, ngang ngược."}], "usage": {"collocations": [], "compounds": ["強引さ（ごういんさ）"], "antonyms": [], "related": ["無理やり（むりやり）"], "synonyms": []}}, {"no": 263, "section": "Unit 03 形容詞A", "kana": "かってな", "word": "勝手な", "form_note": "Nghĩa ③④ dùng như danh từ「勝手」", "meaning_en": "selfish; on its own; situation; convenience", "meaning_vi": "ích kỷ, tùy tiện; tự động, tự ý; tình hình, nếp sinh hoạt (danh từ); sự tiện lợi khi dùng (danh từ)", "examples": [{"jp_ruby": "<ruby>勝手<rt>かって</rt></ruby>な<ruby>言動<rt>げんどう</rt></ruby>は<ruby>他<rt>ほか</rt></ruby>の人の<ruby>迷惑<rt>めいわく</rt></ruby>になる。", "vi": "Lời nói và hành động tùy tiện sẽ gây phiền hà cho người khác."}, {"jp_ruby": "彼は人の物を<ruby>勝手<rt>かって</rt></ruby>に使うので困る。", "vi": "Anh ta tự ý dùng đồ của người khác nên thật là phiền."}, {"jp_ruby": "「こんなうち、出て行ってやる！」「<ruby>勝手<rt>かって</rt></ruby>にしろ！」", "vi": "「Cái nhà thế này, tôi sẽ bỏ đi cho xem!」「Muốn làm gì thì làm!」"}, {"jp_ruby": "このパソコンは、ときどき<ruby>勝手<rt>かって</rt></ruby>にシャットダウンしてしまう。", "vi": "Cái máy tính này thỉnh thoảng tự động tắt nguồn."}, {"jp_ruby": "転勤したばかりで、まだ事務所の<ruby>勝手<rt>かって</rt></ruby>がよくわからない。", "vi": "Tôi mới chuyển công tác đến nên chưa nắm rõ tình hình (cách vận hành) của văn phòng."}, {"jp_ruby": "外国へ行くと何もかも<ruby>勝手<rt>かって</rt></ruby>が<ruby>違<rt>ちが</rt></ruby>う。", "vi": "Ra nước ngoài thì mọi thứ đều khác hẳn (không quen nếp)."}, {"jp_ruby": "この<ruby>台所<rt>だいどころ</rt></ruby>は<ruby>勝手<rt>かって</rt></ruby>が悪くて料理がしにくい。", "vi": "Căn bếp này bố trí bất tiện nên khó nấu nướng."}], "usage": {"collocations": ["勝手がいい⇔悪い", "〜の勝手"], "compounds": ["勝手さ", "自分勝手（な）", "身勝手（な）", "好き勝手（な）", "使い勝手（つかいがって）"], "antonyms": [], "related": ["わがままな", "自己中心的な（じこちゅうしんてきな）", "ひとりでに", "自動的に（じどうてきに）", "状況（じょうきょう）", "事情（じじょう）", "様子（ようす）"], "synonyms": []}}, {"no": 264, "section": "Unit 03 形容詞A", "kana": "つよきな", "word": "強気な", "form_note": "", "meaning_en": "firm; aggressive", "meaning_vi": "cứng rắn, mạnh bạo; lấn lướt, hung hăng", "examples": [{"jp_ruby": "彼女は<ruby>強気<rt>つよき</rt></ruby>な性格で、ときどき<ruby>周<rt>まわ</rt></ruby>りと衝突する。", "vi": "Cô ấy có tính cách cứng rắn nên thỉnh thoảng va chạm với những người xung quanh."}, {"jp_ruby": "<ruby>首相<rt>しゅしょう</rt></ruby>は、<ruby>政策<rt>せいさく</rt></ruby>は必ず成功させると｛<ruby>強気<rt>つよき</rt></ruby>な／<ruby>強気<rt>つよき</rt></ruby>の｝<ruby>発言<rt>はつげん</rt></ruby>を<ruby>繰<rt>く</rt></ruby>り<ruby>返<rt>かえ</rt></ruby>した。", "vi": "Thủ tướng liên tục có những phát biểu cứng rắn rằng nhất định sẽ làm cho chính sách thành công."}, {"jp_ruby": "「あと3年で売り上げを10<ruby>倍<rt>ばい</rt></ruby>に<ruby>伸<rt>の</rt></ruby>ばすぞ」「社長、<ruby>強気<rt>つよき</rt></ruby>ですねえ」", "vi": "「Trong 3 năm nữa sẽ tăng doanh số lên gấp 10 lần đấy」「Sếp mạnh miệng (tự tin) thật đấy nhỉ」"}, {"jp_ruby": "あの人は<ruby>相手<rt>あいて</rt></ruby>が弱いとみると<ruby>強気<rt>つよき</rt></ruby>に出る。", "vi": "Người đó hễ thấy đối phương yếu thế là lại tỏ ra lấn lướt."}], "usage": {"collocations": [], "compounds": ["強気"], "antonyms": ["気弱な（きよわな）", "弱気な（よわきな）"], "related": ["勝気な（かちきな）"], "synonyms": []}}, {"no": 265, "section": "Unit 03 形容詞A", "kana": "がんこな", "word": "頑固な", "form_note": "", "meaning_en": "stubborn; tough", "meaning_vi": "bướng bỉnh, cứng đầu; cứng, dai (vết bẩn, cơn cảm)", "examples": [{"jp_ruby": "妹は<ruby>頑固<rt>がんこ</rt></ruby>で、一度言い出したら<ruby>後<rt>あと</rt></ruby>へは<ruby>引<rt>ひ</rt></ruby>かない。", "vi": "Em gái tôi rất bướng, một khi đã nói ra là không chịu rút lại."}, {"jp_ruby": "何度洗っても落ちない。まったく<ruby>頑固<rt>がんこ</rt></ruby>な<ruby>汚<rt>よご</rt></ruby>れだ。", "vi": "Giặt bao nhiêu lần cũng không sạch. Đúng là vết bẩn cứng đầu."}, {"jp_ruby": "<ruby>頑固<rt>がんこ</rt></ruby>な<ruby>風邪<rt>かぜ</rt></ruby>", "vi": "Cơn cảm dai dẳng, lâu khỏi."}], "usage": {"collocations": [], "compounds": ["頑固さ（がんこさ）"], "antonyms": [], "related": [], "synonyms": ["強情な（ごうじょうな）", "かたくなな", "しつこい"]}}, {"no": 266, "section": "Unit 03 形容詞A", "kana": "かじょうな", "word": "過剰な", "form_note": "", "meaning_en": "excessive", "meaning_vi": "thừa, quá mức, quá độ", "examples": [{"jp_ruby": "<ruby>塩分<rt>えんぶん</rt></ruby>を<ruby>過剰<rt>かじょう</rt></ruby>に<ruby>取<rt>と</rt></ruby>ると体に悪い。", "vi": "Ăn (nạp) quá nhiều muối sẽ có hại cho cơ thể."}, {"jp_ruby": "<ruby>過剰<rt>かじょう</rt></ruby>な<ruby>期待<rt>きたい</rt></ruby>はしない方がいい。", "vi": "Không nên kỳ vọng quá mức."}, {"jp_ruby": "入試の前は「落ちる」という言葉に<ruby>過剰<rt>かじょう</rt></ruby>に<ruby>反応<rt>はんのう</rt></ruby>してしまう。", "vi": "Trước kỳ thi, tôi cứ phản ứng thái quá với từ「trượt」."}], "usage": {"collocations": [], "compounds": ["過剰さ", "自信過剰（な）（じしんかじょう）", "自意識過剰（な）（じいしきかじょう）", "過剰反応（かじょうはんのう）", "過剰摂取（かじょうせっしゅ）"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 267, "section": "Unit 03 形容詞A", "kana": "じゅうだいな", "word": "重大な", "form_note": "", "meaning_en": "serious", "meaning_vi": "nghiêm trọng, trọng đại", "examples": [{"jp_ruby": "<ruby>政治<rt>せいじ</rt></ruby>の<ruby>混乱<rt>こんらん</rt></ruby>を<ruby>招<rt>まね</rt></ruby>いた<ruby>首相<rt>しゅしょう</rt></ruby>の<ruby>責任<rt>せきにん</rt></ruby>は<ruby>重大<rt>じゅうだい</rt></ruby>だ。", "vi": "Trách nhiệm của vị thủ tướng đã gây ra sự hỗn loạn chính trị là rất lớn."}, {"jp_ruby": "この に<ruby>悩<rt>なや</rt></ruby>んでいます」「あまり<ruby>深刻<rt>しんこく</rt></ruby>にならず、ゆっくり<ruby>見守<rt>みまも</rt></ruby>りましょう」", "vi": "「Tôi đang lo lắng vì con hay chống đối」「Đừng quá nghiêm trọng hoá, hãy từ từ quan sát và dõi theo cháu nhé」"}], "usage": {"collocations": ["深刻な事態に陥る", "深刻になる", "深刻に受け止める"], "compounds": ["深刻さ", "深刻化スル（しんこくか）"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 269, "section": "Unit 03 形容詞A", "kana": "きらくな", "word": "気楽な", "form_note": "", "meaning_en": "carefree; comfortable", "meaning_vi": "thoải mái, vô tư, nhẹ nhõm", "examples": [{"jp_ruby": "<ruby>寮<rt>りょう</rt></ruby>に住むより一人暮らしの方が、お金はかかるが<ruby>気楽<rt>きらく</rt></ruby>でいい。", "vi": "So với ở ký túc xá, sống một mình tuy tốn tiền hơn nhưng thoải mái hơn."}, {"jp_ruby": "<ruby>深刻<rt>しんこく</rt></ruby>になっても問題は<ruby>解決<rt>かいけつ</rt></ruby>しない。もっと<ruby>気楽<rt>きらく</rt></ruby>に考えよう。", "vi": "Có nghiêm trọng hoá thì vấn đề cũng không được giải quyết. Hãy nghĩ thoáng hơn nào."}, {"jp_ruby": "<ruby>気楽<rt>きらく</rt></ruby>に｛やる／いく／<ruby>暮<rt>く</rt></ruby>らす／<ruby>生<rt>い</rt></ruby>きる …｝", "vi": "Thoải mái mà {làm / đi / sống / tồn tại ...}."}, {"jp_ruby": "<ruby>気楽<rt>きらく</rt></ruby>な｛<ruby>暮<rt>く</rt></ruby>らし／<ruby>生<rt>い</rt></ruby>き<ruby>方<rt>かた</rt></ruby> …｝", "vi": "{Cuộc sống / lối sống ...} thoải mái, an nhàn."}], "usage": {"collocations": [], "compounds": ["気楽さ（きらくさ）"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 270, "section": "Unit 03 形容詞A", "kana": "あんいな", "word": "安易な", "form_note": "", "meaning_en": "easy; easygoing", "meaning_vi": "dễ dàng, đơn giản; hời hợt, thiếu suy nghĩ", "examples": [{"jp_ruby": "今だけ楽しければいいというのは安易な考え方だ。", "vi": "Cái suy nghĩ chỉ cần vui lúc này là được, thật là hời hợt (thiếu suy nghĩ)."}, {"jp_ruby": "インターネットの情報は<ruby>安易<rt>あんい</rt></ruby>に<ruby>信用<rt>しんよう</rt></ruby>しない方がいい。", "vi": "Không nên dễ dàng tin vào thông tin trên Internet."}], "usage": {"collocations": [], "compounds": ["安易さ（あんいさ）"], "antonyms": [], "related": [], "synonyms": ["簡単な（かんたんな）", "たやすい"]}}, 社<rt>たいしゃ</rt></ruby>することになりました」", "vi": "“Lần này, vì hoàn cảnh riêng, tôi sẽ nghỉ việc.”"}, {"jp_ruby": "<ruby>事情<rt>じじょう</rt></ruby>があって進学をやめた。", "vi": "Vì có lý do riêng nên tôi đã từ bỏ việc học lên tiếp."}, {"jp_ruby": "彼女はヨーロッパの<ruby>事情<rt>じじょう</rt></ruby>に<ruby>詳<rt>くわ</rt></ruby>しい。", "vi": "Cô ấy am hiểu tình hình châu Âu."}, {"jp_ruby": "家を建てたいが、<ruby>経済的<rt>けいざいてき</rt></ruby>な<ruby>事情<rt>じじょう</rt></ruby>が<ruby>許<rt>ゆる</rt></ruby>さない。", "vi": "Tôi muốn xây nhà nhưng hoàn cảnh kinh tế không cho phép."}, {"jp_ruby": "「留学をやめることにしました」「どうしたんですか」「<ruby>事情<rt>じじょう</rt></ruby>が変わったんです」", "vi": "“Tôi quyết định thôi du học.” “Sao vậy?” “Hoàn cảnh đã thay đổi.”"}], "usage": {"collocations": ["事情がある", "事情が変わる", "事情が許さない", "事情が許す限り"], "compounds": ["交通事情", "住宅事情", "経済事情"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 649, "section": "まとめ2", "kana": "じたい", "word": "事態", "form_note": "※悪い意味で使うことが多い", "meaning_en": "situation, state of affairs", "meaning_vi": "tình thế, tình trạng (thường là xấu)", "examples": [{"jp_ruby": "<ruby>預金<rt>よきん</rt></ruby>している<ruby>銀行<rt>ぎんこう</rt></ruby>が<ruby>倒産<rt>とうさん</rt></ruby>するという、大変な<ruby>事態<rt>じたい</rt></ruby>になった。", "vi": "Đã xảy ra tình huống nghiêm trọng là ngân hàng nơi tôi gửi tiền bị phá sản."}, {"jp_ruby": "<ruby>政府<rt>せいふ</rt></ruby>は<ruby>非常事態宣言<rt>ひじょうじたいせんげん</rt></ruby>を出した。", "vi": "Chính phủ đã ban bố tuyên bố tình trạng khẩn cấp."}, {"jp_ruby": "<ruby>緊急事態<rt>きんきゅうじたい</rt></ruby>が<ruby>発生<rt>はっせい</rt></ruby>した。", "vi": "Đã xảy ra tình trạng khẩn cấp."}], "usage": {"collocations": [], "compounds": ["非常事態", "緊急事態", "不測の事態"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 650, "section": "まとめ2", "kana": "しょうがい", "word": "障害", "form_note": "", "meaning_en": "hindrance, difficulty; disorder", "meaning_vi": "trở ngại, chướng ngại; rối loạn, khuyết tật", "examples": [{"jp_ruby": "彼は目が見えないという<ruby>障害<rt>しょうがい</rt></ruby>を乗り越えて、ピアニストになった。", "vi": "Anh ấy đã vượt qua trở ngại là không nhìn thấy được và trở thà g lớn."}, {"jp_ruby": "｛<ruby>不満<rt>ふまん</rt></ruby>／<ruby>生産量<rt>せいさんりょう</rt></ruby> …｝が<ruby>増大<rt>ぞうだい</rt></ruby>する。", "vi": "Sự bất mãn / sản lượng... tăng lên."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["減少する"], "related": ["増す"], "synonyms": ["増加する"]}}, {"no": 657, "section": "まとめ2", "kana": "ぞうりょう", "word": "増量", "form_note": "ガ／ヲ〜スル", "meaning_en": "increase (in weight; in number)", "meaning_vi": "sự tăng lượng (trọng lượng, số lượng)", "examples": [{"jp_ruby": "（<ruby>宣伝<rt>せんでん</rt></ruby>）「<ruby>現在<rt>げんざい</rt></ruby>、1<ruby>割<rt>わり</rt></ruby><ruby>増量<rt>ぞうりょう</rt></ruby>サービス中です」", "vi": "(Quảng cáo) “Hiện đang trong chương trình tăng thêm 10% khối lượng.”"}, {"jp_ruby": "病気が<ruby>悪化<rt>あっか</rt></ruby>し、薬が<ruby>増量<rt>ぞうりょう</rt></ruby>された。", "vi": "Bệnh trở nặng nên liều thuốc đã được tăng lên."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["減量する"], "related": [], "synonyms": []}}, {"no": 658, "section": "まとめ2", "kana": "ぞうぜい", "word": "増税", "form_note": "ガ／ヲ〜スル", "meaning_en": "tax increase", "meaning_vi": "sự tăng thuế", "examples": [{"jp_ruby": "<ruby>労働人口<rt>ろうどうじんこう</rt></ruby>が<ruby>減少<rt>げんしょう</rt></ruby>し、<ruby>政府<rt>せいふ</rt></ruby>は<ruby>増税<rt>ぞうぜい</rt></ruby>を考えているらしい。", "vi": "Dân số lao động giảm, dường như chính phủ đang tính đến việc tăng thuế."}, {"jp_ruby": "<ruby>所得税<rt>しょとくぜい</rt></ruby>が<ruby>増税<rt>ぞうぜい</rt></ruby>された。", "vi": "Thuế thu nhập đã bị tăng."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["減税する"], "related": [], "synonyms": []}}, {"no": 659, "section": "まとめ2", "kana": "ぞういん", "word": "増員", "form_note": "ガ／ヲ〜スル", "meaning_en": "increase in the number of personnel", "meaning_vi": "sự tăng nhân sự, tăng quân số", "examples": [{"jp_ruby": "アメリカ<ruby>大統領<rt>だいとうりょう</rt></ruby><ruby>来日<rt>らいにち</rt></ruby>に当たり、<ruby>警備員<rt>けいびいん</rt></ruby>が<ruby>増員<rt>ぞういん</rt></ruby>された。", "vi": "Nhân dịp Tổng thống Mỹ đến thăm Nhật Bản, lực lượng bảo vệ đã được tăng cường."}, {"jp_ruby": "<ruby>定員<rt>ていいん</rt></ruby>を<ruby>増員<rt>ぞういん</rt></ruby>する。", "vi": "Tăng số lượng nhân viên theo định biên."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["削減する"], "related": [], "synonyms": []}}, {"no": 660, "section": "まとめ2", "kana": "げんてん", "word": "減点", "form_note": "ガ／ヲ〜スル", "meaning_en": "deduction of points", "meaning_vi": "sự trừ điểm", "examples": [{"jp_ruby": "漢字のテストで、<ruby>送<rt>おく</rt></ruby>り<ruby>仮名<rt>がな</rt></ruby>を<ruby>間違<rt>まちが</rt></ruby>えて<ruby>減点<rt>げんてん</rt></ruby>された。", "vi": "Trong bài kiểm tra kanji, tôi bị trừ điểm vì viết sai okurigana."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["加点する"], "related": [], "synonyms": []}}, {"no": 661, "section": "まとめ2", "kana": "げんたい", "word": "減退", "form_note": "ガ〜スル", "meaning_en": "decline", "meaning_vi": "sự suy giảm (thể lực, ham muốn)", "examples": [{"jp_ruby": "暑さのせいで<ruby>食欲<rt>しょくよく</rt></ruby>が<ruby>減退<rt>げんたい</rt></ruby>した。", "vi": "Vì trời nóng nên cảm giác thèm ăn của tôi giảm hẳn."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["増進する"], "related": [], "synonyms": []}}, {"no": 662, "section": "まとめ2", "kana": "げんりょう", "word": "減量", "form_note": "ガ／ヲ〜スル", "meaning_en": "loss in quantity [weight]; losing weight", "meaning_vi": "sự giảm lượng; giảm cân, ép cân", "examples": [{"jp_ruby": "<ruby>洗剤<rt>せんざい</rt></ruby>の<ruby>中身<rt>なかみ</rt></ruby>が<ruby>減量<rt>げんりょう</rt></ruby>された。これでは<ruby>値上<rt>ねあ</rt></ruby>げと同じだ。", "vi": "Lượng bột giặt bên trong đã bị giảm bớt. Thế này thì khác gì tăng giá."}, {"jp_ruby": "ボクサーの<ruby>加藤選手<rt>かとうせんしゅ</rt></ruby>は試合前の<ruby>減量<rt>げんりょう</rt></ruby>に苦しんでいる。", "vi": "Võ sĩ Kato đang khổ sở với việc ép cân trước trận đấu."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["増量する"], "related": [], "synonyms": []}}, {"no": 663, "section": "まとめ2", "kana": "かいはつ", "word": "開発", "form_note": "ヲ〜スル", "meaning_en": "development; exploitation", "meaning_vi": "sự khai phá, phát triển; phát triển (sản phẩm)", "examples": [{"jp_ruby": "<ruby>資源<rt>しげん</rt></ruby>を<ruby>開発<rt>かいはつ</rt></ruby>する。", "vi": "Khai thác tài nguyên."}, {"jp_ruby": "<ruby>海辺<rt>うみべ</rt></ruby>を<ruby>開発<rt>かいはつ</rt></ruby>してリゾート<ruby>地<rt>ち</rt></ruby>にする。", "vi": "Khai phá vùng ven biển để biến thành khu nghỉ dưỡng."}, {"jp_ruby": "駅前の<ruby>再開発<rt>さいかいはつ</rt></ruby>が行われている。", "vi": "Việc tái phát triển khu vực trước nhà ga đang được tiến hành."}, {"jp_ruby": "<ruby>新薬<rt>しんやく</rt></ruby>の<ruby>開発<rt>かいはつ</rt></ruby>に<ruby>成功<rt>せいこう</rt></ruby>した。", "vi": "Đã thành công trong việc phát triển thuốc mới."}, {"jp_ruby": "<ruby>新商品<rt>しんしょうひん</rt></ruby>を<ruby>開発<rt>かいはつ</rt></ruby>する。", "vi": "Phát triển sản phẩm mới."}], "usage": {"collocations": [], "compounds": ["再開発", "都市開発", "国際開発"], "antonyms": ["未開発"], "related": ["未開"], "synonyms": []}}, {"no": 664, "section": "まとめ2", "kana": "かいてん", "word": "開店", "form_note": "ガ／ヲ〜スル ※同じように二つの意味を持つ言葉に「開校、開園、開館、開場」がある", "meaning_en": "opening up a store; open a store", "meaning_vi": "khai trương cửa hàng; mở cửa (bắt đầu bán hàng)", "examples": [{"jp_ruby": "近所に新しいレストランが<ruby>開店<rt>かいてん</rt></ruby>した。", "vi": "Một nhà hàng mới đã khai trương ở gần nhà."}, {"jp_ruby": "<ruby>開店祝<rt>かいてんいわ</rt></ruby>いに<ruby>花束<rt>はなたば</rt></ruby>を<ruby>贈<rt>おく</rt></ruby>った。", "vi": "Tôi đã tặng lẵng hoa để chúc mừng khai trương."}, {"jp_ruby": "「<ruby>開店<rt>かいてん</rt></ruby>は10時です」", "vi": "“Cửa hàng mở cửa lúc 10 giờ.”"}], "usage": {"collocations": [], "compounds": [], "antonyms": ["閉店する"], "related": [], "synonyms": []}}, {"no": 665, "section": "まとめ2", "kana": "かいぎょう", "word": "開業", "form_note": "ガ／ヲ〜スル", "meaning_en": "starting a business", "meaning_vi": "khai trương, mở cơ sở kinh doanh (phòng khám, văn phòng...)", "examples": [{"jp_ruby": "近所に新しい<ruby>書店<rt>しょてん</rt></ruby>が<ruby>開業<rt>かいぎょう</rt></ruby>した。", "vi": "Một hiệu sách mới đã mở ở gần nhà."}, {"jp_ruby": "<ruby>弁護士事務所<rt>べんごしじむしょ</rt></ruby>を<ruby>開業<rt>かいぎょう</rt></ruby>する。", "vi": "Mở văn phòng luật sư."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["廃業する"], "related": [], "synonyms": []}}, {"no": 666, "section": "まとめ2", "kana": "かいさい", "word": "開催", "form_note": "ヲ〜スル", "meaning_en": "holding", "meaning_vi": "việc tổ chức (sự kiện, hội nghị)", "examples": [{"jp_ruby": "<ruby>講演会<rt>こうえんかい</rt></ruby>を<ruby>開催<rt>かいさい</rt></ruby>する。", "vi": "Tổ chức buổi thuyết giảng."}, {"jp_ruby": "「<ruby>次<rt>つぎ</rt></ruby>のオリンピックの<ruby>開催地<rt>かいさいち</rt></ruby>はどこですか」", "vi": "“Địa điểm tổ chức Thế vận hội Olympic tiếp theo là ở đâu?”"}], "usage": {"collocations": [], "compounds": ["開催地"], "antonyms": [], "related": ["催す"], "synonyms": []}}, {"no": 667, "section": "まとめ2", "kana": "かいほう", "word": "開放", "form_note": "ヲ〜スル", "meaning_en": "open", "meaning_vi": "sự mở cửa cho công chúng; mở cửa (thị trường)", "examples": [{"jp_ruby": "近所の小学校の<ruby>校庭<rt>こうてい</rt></ruby>は、日曜日には<ruby>市民<rt>しみん</rt></ruby>に<ruby>開放<rt>かいほう</rt></ruby>されている。", "vi": "Sân trường của trường tiểu học gần nhà được mở cho người dân sử dụng vào các ngày Chủ nhật."}, {"jp_ruby": "アメリカはB国に市場の<ruby>開放<rt>かいほう</rt></ruby>を<ruby>求<rt>もと</rt></ruby>めた。", "vi": "Mỹ đã yêu cầu nước B mở cửa thị trường."}, {"jp_ruby": "（<ruby>張<rt>は</rt></ruby>り<ruby>紙<rt>がみ</rt></ruby>）「<ruby>開放厳禁<rt>かいほうげんきん</rt></ruby>」", "vi": "(Biển dán) “Nghiêm cấm để cửa mở.”"}], "usage": {"collocations": [], "compounds": ["開放的な"], "antonyms": ["閉鎖する"], "related": ["開けっぱなし"], "synonyms": []}}, {"no": 668, "section": "まとめ2", "kana": "へいさ", "word": "閉鎖", "form_note": "ヲ〜スル", "meaning_en": "close; closedown; unsociable", "meaning_vi": "sự đóng cửa, phong tỏa; khép kín (tính cách)", "examples": [{"jp_ruby": "この公園の<ruby>門<rt>もん</rt></ruby>は、<ruby>夜間<rt>やかん</rt></ruby>は<ruby>閉鎖<rt>へいさ</rt></ruby>されている。", "vi": "Cổng của công viên này bị đóng vào ban đêm."}, {"jp_ruby": "会社が<ruby>倒産<rt>とうさん</rt></ruby>し、工場は<ruby>閉鎖<rt>へいさ</rt></ruby>された。", "vi": "Công ty phá sản, nhà máy bị đóng cửa."}, {"jp_ruby": "<ruby>田舎<rt>いなか</rt></ruby>は<ruby>閉鎖的<rt>へいさてき</rt>< /rt></ruby>かいところまで<ruby>手<rt>て</rt></ruby>が<ruby>回<rt>まわ</rt></ruby>らない。", "vi": "Bận quá nên không lo xuể đến những chi tiết nhỏ."}, {"jp_ruby": "<ruby>気<rt>き</rt></ruby>が<ruby>回<rt>まわ</rt></ruby>る。", "vi": "Chu đáo, để ý đến mọi thứ."}, {"jp_ruby": "<ruby>目<rt>め</rt></ruby>が<ruby>回<rt>まわ</rt></ruby>る。", "vi": "Chóng mặt, hoa mắt (vì bận quay cuồng)."}, {"jp_ruby": "<ruby>頭<rt>あたま</rt></ruby>が<ruby>回<rt>まわ</rt></ruby>らない。", "vi": "Đầu óc không vận hành nổi, nghĩ không thông."}], "form_note": "ガ〜", "kana": "まわる", "meaning_en": "revolve, turn around; be passed around; make a tour; go around (to); handle, take effect; be past ~", "meaning_vi": "quay, xoay; đến lượt, được chuyền đến; đi vòng quanh, tham quan; qua, quá (giờ); ghé qua; lan ra (hơi rượu, độc); xoay xở được, lo liệu được", "no": 702, "section": "Unit 08 動詞B", "usage": {"antonyms": [], "collocations": [], "compounds": [], "related": [], "synonyms": []}, "word": "回る"}, {"examples": [{"jp_ruby": "ドアの<ruby>取<rt>と</rt></ruby>っ<ruby>手<rt>て</rt></ruby>を<ruby>回<rt>まわ</rt></ruby>して<ruby>開<rt>あ</rt></ruby>ける。", "vi": "Vặn tay nắm cửa để mở."}, {"jp_ruby": "｛<ruby>洗濯機<rt>せんたくき</rt></ruby>／<ruby>扇風機<rt>せんぷうき</rt></ruby>／ビデオ（カメラ）…｝を<ruby>回<rt>まわ</rt></ruby>す。", "vi": "Cho máy giặt / quạt / máy quay... chạy."}, {"jp_ruby": "お<ruby>知<rt>し</rt></ruby>らせを<ruby>全員<rt>ぜんいん</rt></ruby>に<ruby>回<rt>まわ</rt></ruby>す。", "vi": "Chuyển thông báo cho tất cả mọi người."}, {"jp_ruby": "もう<ruby>遅<rt>おそ</rt></ruby>いので、<ruby>残<rt>のこ</rt></ruby>りの<ruby>仕事<rt>しごと</rt></ruby>は<ruby>明日<rt>あした</rt></ruby>に<ruby>回<rt>まわ</rt></ruby>して<ruby>帰<rt>かえ</rt></ruby>ろう。", "vi": "Muộn rồi, phần việc còn lại để sang ngày mai, về thôi."}, {"jp_ruby": "<ruby>電話<rt>でんわ</rt></ruby>を<ruby>総務部<rt>そうむぶ</rt></ruby>に<ruby>回<rt>まわ</rt></ruby>す。", "vi": "Chuyển cuộc gọi đến phòng tổng vụ."}, {"jp_ruby": "<ruby>病院<rt>びょういん</rt></ruby>で<ruby>内科<rt>ないか</rt></ruby>から<ruby>皮膚科<rt>ひふか</rt></ruby>に<ruby>回<rt>まわ</rt></ruby>された。", "vi": "Ở bệnh viện, tôi bị chuyển từ khoa nộ  "vi": "Đánh mất cơ hội / thời cơ..."}, {"jp_ruby": "<ruby>私<rt>わたし</rt></ruby>は<ruby>飛行機事故<rt>ひこうきじこ</rt></ruby>で<ruby>親<rt>おや</rt></ruby>を<ruby>失<rt>うしな</rt></ruby>った。", "vi": "Tôi đã mất cha mẹ trong vụ tai nạn máy bay."}, {"jp_ruby": "<ruby>頭<rt>あたま</rt></ruby>を<ruby>打<rt>う</rt></ruby>って｛<ruby>気<rt>き</rt></ruby>／<ruby>意識<rt>いしき</rt></ruby>｝を<ruby>失<rt>うしな</rt></ruby>った。", "vi": "Đập đầu rồi mất ý thức (ngất đi)."}], "usage": {"collocations": [], "compounds": [], "antonyms": ["得る"], "related": [], "synonyms": ["なくす", "逃す", "亡くす"]}}, {"no": 724, "section": "Unit 08 動詞B", "kana": "せめる", "word": "攻める", "form_note": "ヲ〜", "meaning_en": "attack", "meaning_vi": "tấn công", "examples": [{"jp_ruby": "<ruby>敵<rt>てき</rt></ruby>を<ruby>攻<rt>せ</rt></ruby>める。", "vi": "Tấn công kẻ địch."}, {"jp_ruby": "<ruby>積極的<rt>せっきょくてき</rt></ruby>に<ruby>相手<rt>あいて</rt></ruby>チームを<ruby>攻<rt>せ</rt></ruby>めて<ruby>勝利<rt>しょうり</rt></ruby>した。", "vi": "Tích cực tấn công đội đối thủ và giành chiến thắng."}], "usage": {"collocations": [], "compounds": ["攻め込む", "攻め立てる"], "antonyms": ["守る"], "related": [], "synonyms": ["攻撃する"]}}, {"no": 725, "section": "Unit 08 動詞B", "kana": "にらむ", "word": "睨む", "form_note": "ヲ〜", "meaning_en": "stare (at); incur one's displeasure", "meaning_vi": "trừng mắt nhìn, lườm; bị để mắt, bị nhắm làm đối tượng", "examples": [{"jp_ruby": "その<ruby>学生<rt>がくせい</rt></ruby>は<ruby>注意<rt>ちゅうい</rt></ruby>されて、<ruby>逆<rt>ぎゃく</rt></ruby>に<ruby>先生<rt>せんせい</rt></ruby>をにらんだ。", "vi": "Học sinh đó bị nhắc nhở, ngược lại còn trừng mắt nhìn thầy giáo."}, {"jp_ruby": "いつも<ruby>事件<rt>じけん</rt></ruby>を<ruby>起<rt>お</rt></ruby>こす<ruby>彼<rt>かれ</rt></ruby>は、<ruby>警察<rt>けいさつ</rt></ruby>ににらまれている。", "vi": "Anh ta thường xuyên gây chuyện nên bị cảnh sát để mắt tới."}], "usage": {"collocations": [], "compounds": ["にらみつける"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 726, "section": "Unit 08 動詞B", "kana": "せめる", "word": "責める", "form_note": "ヲ〜", "meaning_en": "blame", "meaning_vi": "trách móc, khiển trách, quy tội", "examples": [{"jp_ruby": "<ruby>相手<rt>あいて</rt></ruby>の<ruby>失敗<rt>しっぱい</rt></ruby>を<ruby>責<rt>せ</rt></ruby>める。", "vi": "Trách móc thất bại của đối phương."}, {"jp_ruby": "<ruby>過<rt>あやま</rt></ruby>ちをおかした<ruby>自分<rt>じぶん</rt></ruby>を<ruby>激<rt>はげ</rt></ruby>しく<ruby>責<rt>せ</rt></ruby>めた。", "vi": "Tôi tự trách mình gay gắt vì lỗi lầm đã gây ra."}], "usage": {"collocations": [], "compounds": ["責め立てる"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 727, "section": "Unit 08 動詞B", "kana": "うらぎる", "word": "裏切る", "form_note": "ヲ〜 （名）裏切り", "meaning_en": "betray; disappoint, be contrary to one's expectation", "meaning_vi": "phản bội; phụ lòng, trái với kỳ vọng", "examples": [{"jp_ruby": "<ruby>彼<rt>かれ</rt></ruby>は<ruby>味方<rt>みかた</rt></ruby>を<ruby>裏切<rt>うらぎ</rt></ruby>り、<ruby>敵<rt>てき</rt></ruby>のグループに<ruby>入<rt>はい</rt></ruby>った。", "vi": "Anh ta phản bội đồng đội, gia nhập nhóm của địch."}, {"jp_ruby": "<ruby>田中選手<rt>たなかせんしゅ</rt></ruby>はファンの<ruby>期待<rt>きたい</rt></ruby>を<ruby>裏切<rt>うらぎ</rt></ruby>り、1<ruby>回戦<rt>かいせん</rt></ruby>で<ruby>負<rt>ま</rt></ruby>けてしまった。", "vi": "Cầu thủ Tanaka đã phụ kỳ vọng của người hâm mộ, thua ngay ở vòng một."}, {"jp_ruby": "｛<ruby>予想<rt>よそう</rt></ruby>／<ruby>信頼<rt>しんらい</rt></ruby>／<ruby>友情<rt>ゆうじょう</rt></ruby> …｝を<ruby>裏切<rt>うらぎ</rt></ruby>る。", "vi": "Trái với dự đoán / phản bội lòng tin / tình bạn..."}], "usage": {"collocations": [], "compounds": ["裏切り者"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 728, "section": "Unit 08 動詞B", "kana": "たよる", "word": "頼る", "form_note": "ヲ／ニ〜 （名）頼り", "meaning_en": "rely on, depend on; count on", "meaning_vi": "dựa vào, nhờ cậy vào; trông cậy", "examples": [{"jp_ruby": "<ruby>彼<rt>かれ</rt></ruby>は<ruby>学費<rt>がくひ</rt></ruby>を<ruby>親<rt>おや</rt></ruby>に<ruby>頼<rt>たよ</rt></ruby>らず、<ruby>自分<rt>じぶん</rt></ruby>で<ruby>働<rt>はたら</rt></ruby>いて<ruby>払<rt>はら</rt></ruby>っている。", "vi": "Anh ấy không nhờ cậy cha mẹ về học phí mà tự đi làm để trả."}, {"jp_ruby": "いつまでも<ruby>辞書<rt>じしょ</rt></ruby>に<ruby>頼<rt>たよ</rt></ruby>っていると、<ruby>読<rt>よ</rt></ruby>む<ruby>力<rt>ちから</rt></ruby>がなかなかつかない。", "vi": "Cứ dựa dẫm mãi vào từ điển thì năng lực đọc khó mà khá lên được."}, {"jp_ruby": "<ruby>東京<rt>とうきょう</rt></ruby>にいる<ruby>親<rt>しん</rt></ruby>せきを<ruby>頼<rt>たよ</rt></ruby>って<ruby>日本<rt>にほん</rt></ruby>へ<ruby>来<rt>き</rt></ruby>た。", "vi": "Tôi nhờ cậy người họ hàng ở Tokyo để sang Nhật."}, {"jp_ruby": "ガイドブックを<ruby>頼<rt>たよ</rt></ruby>りに<ruby>旅行<rt>りょこう</rt></ruby>をした。", "vi": "Tôi đi du lịch dựa vào sách hướng dẫn."}, {"jp_ruby": "<ruby>地震<rt>じしん</rt></ruby>や<ruby>停電<rt>ていでん</rt></ruby>のときはラジオが<ruby>頼<rt>たよ</rt></ruby>りになる。", "vi": "Khi có động đất hay mất điện thì radio là thứ đáng tin cậy."}, {"jp_ruby": "<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>仕事<rt>しごと</rt></ruby>ができるので<ruby>同僚<rt>どうりょう</rt></ruby>や<ruby>後輩<rt>こうはい</rt></ruby>から<ruby>頼<rt>たよ</rt></ruby>りにされている。", "vi": "Cô ấy làm việc giỏi nên được đồng nghiệp và hậu bối tin cậy, nhờ cậy."}], "usage": {"collocations": ["頼りにする", "頼りになる⇔ならない"], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 729, "section": "Unit 08 動詞B", "kana": "あう", "word": "遭う", "form_note": "ガ〜", "meaning_en": "encounter, meet with", "meaning_vi": "gặp phải (tai nạn, khó khăn)", "examples": [{"jp_ruby": "<ruby>交通事故<rt>こうつうじこ</rt></ruby>に<ruby>遭<rt>あ</rt></ruby>ってけがをした。", "vi": "Gặp tai nạn giao thông và bị thương."}, {"jp_ruby": "<ruby>困難<rt>こんなん</rt></ruby>に<ruby>遭<rt>あ</rt></ruby>ってもあきらめてはいけない。", "vi": "Dù gặp khó khăn cũng không được bỏ cuộc."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 730, "section": "Unit 08 動詞B", "kana": "まねく", "word": "招く", "form_note": "ヲ〜 （名）招き（例：お招きありがとうございました）", "meaning_en": "invite; beckon; call in; bring about, cause", "meaning_vi": "mời, chiêu đãi; vẫy tay gọi; mời đến (làm việc); gây ra, dẫn đến", "examples": [{"jp_ruby": "<ruby>自宅<rt>じたく</rt></ruby>に<ruby>友人<rt>ゆうじん</rt></ruby>を<ruby>招<rt>まね</rt></ruby>いた。", "vi": "Tôi mời bạn bè đến nhà."}, {"jp_ruby": "<ruby>結婚式<rt>けっこんしき</rt></ruby>に<ruby>招<rt>まね</rt></ruby>かれてスピーチをした。", "vi": "Được mời đến dự đám cưới và tôi đã phát biểu."}, {"jp_ruby": "<ruby>海外<rt>かいがい</rt></ruby>で<ruby>出会<rt>であ</rt></ruby>った<ruby>少年<rt>しょうねん</rt></ruby>は、<ruby>自分<rt>じぶん</rt></ruby>について<ruby>来<rt>こ</rt></ruby>いと<ruby>手<rt>て</rt></ruby>で<ruby>招<rt>まね</rt></ruby>いた。", "vi": "Cậu bé tôi gặp ở nước ngoài đã vẫy tay ra hiệu bảo tôi đi theo cậu."}, {"jp_ruby": "○○<ruby>大学<rt>だいがく</rt></ruby>は<ruby>有名<rt>ゆうめい</rt></ruby>な<ruby>漫画家<rt>まんがか</rt></ruby>を<ruby>教授<rt>きょうじゅ</rt></ruby>に<ruby>招<rt>まね</rt></ruby>いた。", "vi": "Trường đại học ○○ đã mời một họa sĩ truyện tranh nổi tiếng về làm giáo sư."}, {"jp_ruby": "<ruby>首相<rt>しゅしょう</rt></ruby>の<ruby>言葉<rt>ことば</rt></ruby>は<ruby>世間<rt>せけん</rt></ruby>の<ruby>批判<rt>ひはん</rt></ruby>を<ruby>招<rt>まね</rt></ruby>いた。", "vi": "Phát ngôn của thủ tướng đã gây ra sự chỉ trích của dư luận."}, {"jp_ruby": "<ruby>点検<rt>てんけん</rt></ruby>ミスが<ruby>大事故<rt>だいじこ</rt></ruby>を<ruby>招<rt>まね</rt></ruby>いた。", "vi": "Sai sót trong khâu kiểm tra đã dẫn đến một tai nạn lớn."}], "usage": {"collocations": [], "compounds": ["手招き（をする）"], "antonyms": [], "related": [], "synonyms": ["招待する", "引き起こす"]}}, {"no": 731, "section": "Unit 08 動詞B", "kana": "ひっかかる", "word": "引っ掛かる", "form_note": "ガ〜", "meaning_en": "get caught, be hooked; be cheated, be entangled; have a thing on one's mind", "meaning_vi": "mắc vào, vướng vào; bị phát hiện (khi kiểm tra); bận tâm, vướng mắc trong lòng; bị lừa", "examples": [{"jp_ruby": "<ruby>山<rt>やま</rt></ruby>で<ruby>服<rt>ふく</rt></ruby>が<ruby>木<rt>き</rt></ruby>に<ruby>引<rt>ひ</rt></ruby>っかかって<ruby>破<rt>やぶ</rt></ruby>れてしまった。", "vi": "Ở trên núi, quần áo bị mắc vào cây và rách mất."}, {"jp_ruby": "<ruby>髪<rt>かみ</rt></ruby>が<ruby>痛<rt>いた</rt></ruby>んでいて、<ruby>指<rt>ゆび</rt></ruby>に<ruby>引<rt>ひ</rt></ruby>っかかる。", "vi": "Tóc bị hư tổn nên cứ vướng vào ngón tay."}, {"jp_ruby": "<ruby>血液検査<rt>けつえきけんさ</rt></ruby>に<ruby>引<rt>ひ</rt></ruby>っかかった。", "vi": "Bị vướng (có kết quả bất thường) ở xét nghiệm máu."}, {"jp_ruby": "この<ruby>情報<rt>じょうほう</rt></ruby>はなんだかひっかかる。もう<ruby>少<rt>すこ</rt></ruby>し<ruby>調<rt>しら</rt></ruby>べてみよう。", "vi": "Thông tin này có gì đó khiến tôi bận tâm. Thử tìm hiểu thêm xem."}, {"jp_ruby": "<ruby>悪<rt>わる</rt></ruby>い<ruby>男<rt>おとこ</rt></ruby>に<ruby>引<rt>ひ</rt></ruby>っかかって、<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>全財産<rt>ぜんざいさん</rt></ruby>をとられてしまった。", "vi": "Bị gã đàn ông xấu xa lừa, cô ấy bị lấy mất toàn bộ tài sản."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": ["気にかかる"], "synonyms": ["だまされる"]}}, {"no": 732, "section": "Unit 08 動詞B", "kana": "ひっかける", "word": "引っ掛ける", "form_note": "ヲ〜", "meaning_en": "scratch; throw on; splash; cheat; have (a drink)", "meaning_vi": "móc vào, làm vướng vào; khoác vội lên người; hắt, té (nước); lừa gạt; làm một ly (rượu)", "examples": [{"jp_ruby": "<ruby>釘<rt>くぎ</rt></ruby>に<ruby>服<rt>ふく</rt></ruby>をひっかけて<ruby>破<rt>やぶ</rt></ruby>ってしまった。", "vi": "Tôi làm áo mắc vào đinh và rách mất."}, {"jp_ruby": "ちょっと<ruby>寒<rt>さむ</rt></ruby>かったのか、<ruby>弟<rt>おとうと</rt></ruby>は<ruby>上着<rt>うわぎ</rt></ruby>をひっかけてコンビニに<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>行<rt>い</rt></ruby>った。", "vi": "Có lẽ hơi lạnh, em trai tôi khoác vội áo khoác rồi đi mua đồ ở cửa hàng tiện lợi."}, {"jp_ruby": "サンダルはひっかけているだけなので<ruby>脱<rt>ぬ</rt></ruby>げやすい。", "vi": "Dép chỉ xỏ hờ vào nên dễ bị tuột."}, {"jp_ruby": "<ruby>雨<rt>あめ</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>、<ruby>走<rt>はし</rt></ruby>って<ruby>来<rt>き</rt></ruby>た<ruby>車<rt>くるま</rt></ruby>に<ruby>泥水<rt>どろみず</rt></ruby>をひっかけられた。", "vi": "Ngày mưa, tôi bị chiếc xe chạy tới hắt nước bùn vào người."}, {"jp_ruby": "<ruby>映画<rt>えいが</rt></ruby>の<ruby>中<rt>なか</rt></ruby>で<ruby>女<rt>おんな</rt></ruby>が<ruby>男<rt>おとこ</rt></ruby>にコップの<ruby>水<rt>みず</rt></ruby>を<ruby>頭<rt>あたま</rt></ruby>から<ruby>引<rt>ひ</rt></ruby>っかけるシーンがあった。", "vi": "Trong phim có cảnh người phụ nữ hắt cốc nước vào đầu người đàn ông."}, {"jp_ruby": "「<ruby>悪<rt>わる</rt></ruby>い<ruby>男<rt>おとこ</rt></ruby>にひっかけられないようにね」", "vi": "\"Nhớ cẩn thận đừng để bị gã đàn ông xấu lừa nhé.\""}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["だます"]}}, {"no": 733, "section": "Unit 08 動詞B", "kana": "ひっくりかえる", "word": "ひっくり返る", "form_note": "ガ〜", "meaning_en": "turn over, reverse; fall (on one's back); be in confusion", "meaning_vi": "lật ngược, đổ nhào; ngã ngửa ra; rối tung lên, đảo lộn", "examples": [{"jp_ruby": "ボートが<ruby>波<rt>なみ</rt></ruby>でひっくり<ruby>返<rt>かえ</rt></ruby>って<ruby>上下<rt>じょうげ</rt></ruby>さかさまになった。", "vi": "Chiếc thuyền bị sóng đánh lật ngược, trên dưới đảo lộn."}, {"jp_ruby": "<ruby>世<rt>よ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>がひっくり<ruby>返<rt>かえ</rt></ruby>るような<ruby>事件<rt>じけん</rt></ruby>が<ruby>起<rt>お</rt></ruby>こった。", "vi": "Đã xảy ra một sự kiện như thể đảo lộn cả thế giới."}, {"jp_ruby": "すべって<ruby>仰向<rt>あおむ</rt></ruby>けにひっくり<ruby>返<rt>かえ</rt></ruby>った。", "vi": "Tôi trượt chân ngã ngửa ra."}, {"jp_ruby": "ベッドにひっくり<ruby>返<rt>かえ</rt></ruby>って<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むのが<ruby>楽<rt>たの</rt></ruby>しみだ。", "vi": "Nằm ngửa trên giường đọc sách là thú vui của tôi."}, {"jp_ruby": "まだ<ruby>引<rt>ひ</rt></ruby>っ<ruby>越<rt>こ</rt></ruby>したばかりで、<ruby>家中<rt>いえじゅう</rt></ruby>ひっくり<ruby>返<rt>かえ</rt></ruby>っている。", "vi": "Vì mới chuyển nhà nên cả nhà đang bừa bộn rối tung lên."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 734, "section": "Unit 08 動詞B", "kana": "ひっくりかえす", "word": "ひっくり返す", "form_note": "ヲ〜", "meaning_en": "overturn; knock over; turn out", "meaning_vi": "lật ngược, lật úp; làm đổ; lục tung ra", "examples": [{"jp_ruby": "<ruby>魚<rt>さかな</rt></ruby>をひっくり<ruby>返<rt>かえ</rt></ruby>して<ruby>焼<rt>や</rt></ruby>く。", "vi": "Lật cá lại để nướng."}, {"jp_ruby": "この<ruby>箱<rt>はこ</rt></ruby>をひっくり<ruby>返<rt>かえ</rt></ruby>して<ruby>机<rt>つくえ</rt></ruby>の<ruby>代<rt>か</rt></ruby>わりにしよう。", "vi": "Lật úp cái thùng này lại để dùng thay bàn."}, {"jp_ruby": es": [{"jp_ruby": "メーカーは<ruby>海外<rt>かいがい</rt></ruby>に<ruby>工場<rt>こうじょう</rt></ruby>を持っていることが多い。", "vi": "Các nhà sản xuất thường có nhà máy ở nước ngoài."}, {"jp_ruby": "彼はクラスのムードメーカーだ。", "vi": "Anh ấy là người tạo bầu không khí của lớp."}, {"jp_ruby": "<ruby>結婚祝<rt>けっこんいわ</rt></ruby>いにコーヒーメーカーをもらった。", "vi": "Tôi được tặng một chiếc máy pha cà phê làm quà mừng cưới."}], "usage": {"collocations": [], "compounds": ["メーカー品", "[名詞]＋メーカー（例：食品メーカー、自動車メーカー）", "ムードメーカー", "トラブルメーカー"], "antonyms": [], "related": [], "synonyms": ["製造業者（せいぞうぎょうしゃ）"]}}, {"no": 819, "section": "Unit 09 カタカナB", "kana": "システム", "word": "システム", "form_note": "", "meaning_en": "system", "meaning_vi": "hệ thống, cơ chế", "examples": [{"jp_ruby": "今、<ruby>教育<rt>きょういく</rt></ruby>システムの<ruby>見直<rt>みなお</rt></ruby>しが進んでいる。", "vi": "Hiện nay, việc rà soát lại hệ thống giáo dục đang được tiến hành."}, {"jp_ruby": "<ruby>新製品<rt>しんせいひん</rt></ruby>を<ruby>生産<rt>せいさん</rt></ruby>するため、<ruby>工場<rt>こうじょう</rt></ruby>のシステムを変更した。", "vi": "Để sản xuất sản phẩm mới, (chúng tôi) đã thay đổi hệ thống của nhà máy."}, {"jp_ruby": "この会は、<ruby>紹介者<rt>しょうかいしゃ</rt></ruby>がいないと<ruby>入会<rt>にゅうかい</rt></ruby>できないシステムになっている。", "vi": "Hội này có cơ chế là không có người giới thiệu thì không thể gia nhập."}], "usage": {"collocations": [], "compounds": ["[名詞]＋システム（例：料金前払いシステム）", "システムエンジニア"], "antonyms": [], "related": [], "synonyms": ["仕組み（しくみ）", "体系（たいけい）", "制度（せいど）"]}}, {"no": 820, "section": "Unit 09 カタカナB", "kana": "ケース", "word": "ケース", "form_note": "", "meaning_en": "case", "meaning_vi": "hộp, vỏ đựng; thùng (đựng chai); trường hợp", "examples": [{"jp_ruby": "<ruby>指輪<rt>ゆびわ</rt></ruby>をケースにしまった。", "vi": "Tôi cất chiếc nhẫn vào hộp."}, {"jp_ruby": "ビールを3ケース<ruby>注文<rt>ちゅうもん</rt></ruby>した。", "vi": "Tôi đã đặt 3 thùng bia."}, {"jp_ruby": "いじめがきっかけで<ruby>不登校<rt>ふとうこう</rt></ruby>になるケースが多い。", "vi": "Có nhiều trường hợp học sinh nghỉ học vì bị bắt nạt."}, {"jp_ruby": "これは<ruby>特殊<rt>とくしゅ</rt></ruby>なケースで、だれにでも当てはまるわけではない。", "vi": "Đây là tr ], "related": [], "synonyms": ["もめ事（もめごと）"]}}, {"no": 824, "section": "Unit 09 カタカナB", "kana": "エラー", "word": "エラー", "form_note": "", "meaning_en": "error", "meaning_vi": "lỗi (máy móc, nhập liệu); lỗi (trong bóng chày)", "examples": [{"jp_ruby": "このデジカメ（＜デジタルカメラ）はよくエラーが起こる。", "vi": "Chiếc máy ảnh kỹ thuật số này hay bị lỗi."}, {"jp_ruby": "パソコンに<ruby>入力<rt>にゅうりょく</rt></ruby>していたら、<ruby>画面<rt>がめん</rt></ruby>にエラーの<ruby>表示<rt>ひょうじ</rt></ruby>が出た。", "vi": "Đang nhập liệu trên máy tính thì trên màn hình hiện thông báo lỗi."}, {"jp_ruby": "（<ruby>野球<rt>やきゅう</rt></ruby>）<ruby>外野手<rt>がいやしゅ</rt></ruby>のエラーで1<ruby>点<rt>てん</rt></ruby>を取られた。", "vi": "(Bóng chày) Vì lỗi của cầu thủ ngoài sân mà (đội) bị mất 1 điểm."}], "usage": {"collocations": ["エラーをする", "エラーが起こる・エラーーを起こす"], "compounds": ["エラーメッセージ", "エラーコード", "エラー画面", "エラー表示"], "antonyms": [], "related": ["ミス"], "synonyms": []}}, {"no": 825, "section": "Unit 09 カタカナB", "kana": "クレーム", "word": "クレーム", "form_note": "類「苦情」☞903", "meaning_en": "complaint, objection", "meaning_vi": "khiếu nại, phàn nàn (của khách hàng)", "examples": [{"jp_ruby": "「買った肉が変なにおいがする」と、スーパーにクレームがあった。", "vi": "Có khách khiếu nại với siêu thị rằng 「thịt đã mua có mùi lạ」."}, {"jp_ruby": "最近は、小さなことで学校にクレームをつける親が多くなった。", "vi": "Gần đây, ngày càng nhiều phụ huynh phàn nàn với nhà trường vì những chuyện nhỏ nhặt."}], "usage": {"collocations": ["〜にクレームがある", "〜にクレームがつく・〜にクレームをつける"], "compounds": [], "antonyms": [], "related": ["文句（もんく）"], "synonyms": ["苦情（くじょう）"]}}, {"no": 826, "section": "Unit 09 カタカナB", "kana": "キャンセル", "word": "キャンセル", "form_note": "ヲ〜スル", "meaning_en": "cancellation", "meaning_vi": "hủy, hủy bỏ (đặt chỗ, lịch hẹn...)", "examples": [{"jp_ruby": "ホテルの<ruby>予約<rt>よやく</rt></ruby>をキャンセルした。", "vi": "Tôi đã hủy đặt phòng khách sạn."}, {"jp_ruby": "｛チケット／<ruby>予定<rt>よてい</rt></ruby>／<ruby>契約<rt>けいやく</rt></ruby> …｝をキャンセルする。", "vi": "Hủy ｛vé / lịch hẹn / hợp đồng …｝."}, {"jp_ruby": "チケットは売り切れだったが、<ruby>直前<rt>ちょくぜん</rt></ruby>にキャンセルが出てコンサートに行けた。", "vi": "Vé đã bán hết, nhưng ngay trước giờ có suất hủy nên tôi đã đi xem hòa nhạc được."}], "usage": {"collocations": ["キャンセルが出る"], "compounds": ["キャンセル料", "キャンセル待ち"], "antonyms": [], "related": [], "synonyms": ["取り消し（とりけし）"]}}, {"no": 827, "section": "Unit 09 カタカナB", "kana": "ストップ", "word": "ストップ", "form_note": "ガ／ヲ〜スル；類「停止スル」☞368", "meaning_en": "stop", "meaning_vi": "dừng, ngưng, đình lại", "examples": [{"jp_ruby": "<ruby>踏切事故<rt>ふみきりじこ</rt></ruby>で電車が1時間ストップした。", "vi": "Vì tai nạn ở đường ngang chắn tàu, tàu điện đã dừng suốt 1 giờ."}, {"jp_ruby": "<ruby>駅前開発計画<rt>えきまえかいはつけいかく</rt></ruby>は、<ruby>住民<rt>じゅうみん</rt></ruby>の<ruby>反対<rt>はんたい</rt></ruby>でストップしている。", "vi": "Kế hoạch phát triển khu vực trước nhà ga đang bị đình lại vì sự phản đối của cư dân."}], "usage": {"collocations": ["ストップがかかる・ストップをかける"], "compounds": ["ドクターストップ"], "antonyms": [], "related": [], "synonyms": ["停止スル（ていしスル）"]}}, {"no": 828, "section": "Unit 09 カタカナB", "kana": "カット", "word": "カット", "form_note": "ヲ〜スル", "meaning_en": "cut; reduction", "meaning_vi": "cắt (thành miếng); cắt giảm (lương, ngân sách); cắt bỏ (cảnh phim, tạp âm); cắt tóc; gọt, cắt (hoa quả)", "examples": [{"jp_ruby": "ケーキを八つにカットした。", "vi": "Tôi cắt chiếc bánh thành tám phần."}, {"jp_ruby": "<ruby>木材<rt>もくざい</rt></ruby>を20センチの長さにカットして<ruby>箸<rt>はし</rt></ruby>を作った。", "vi": "Cắt gỗ thành độ dài 20 cm để làm đũa."}, {"jp_ruby": "会社の<ruby>業績<rt>ぎょうせき</rt></ruby>が悪く、<ruby>賃金<rt>ちんぎん</rt></ruby>がカットされた。", "vi": "Thành tích kinh doanh của công ty kém nên lương bị cắt giảm."}, {"jp_ruby": "このままだと<ruby>予算<rt>よさん</rt></ruby>オーバーなので、少しカットしなければならない。", "vi": "Cứ thế này thì sẽ vượt ngân sách nên phải cắt giảm một chút."}, {"jp_ruby": "<ruby>映画<rt>えいが</rt></ruby>から<ruby>残酷<rt>ざんこく</rt></ruby>な<ruby>場面<rt>ばめん</rt></ruby>がカットされた。", "vi": "Cảnh tàn khốc đã bị cắt bỏ khỏi bộ phim."}, {"jp_ruby": "古い<ruby>録音<rt>ろくおん</rt></ruby>から<ruby>雑音<rt>ざつおん</rt></ruby>をカットしてCD<ruby>化<rt>か</rt></ruby>した。", "vi": "Cắt bỏ tạp âm khỏi bản ghi âm cũ và chuyển thành CD."}, {"jp_ruby": "<ruby>髪<rt>かみ</rt></ruby>が伸びてきたので<ruby>美容院<rt>びよういん</rt></ruby>でカットした。", "vi": "Tóc đã dài ra nên tôi đi cắt tóc ở tiệm làm tóc."}, {"jp_ruby": "（<ruby>美容院<rt>びよういん</rt></ruby>で）「今日はどうなさいますか」「カットをお願いします」", "vi": "(Ở tiệm làm tóc) 「Hôm nay quý khách làm gì ạ?」 「Cho tôi cắt tóc」."}, {"jp_ruby": "りんごをカットしてうさぎの形にした。", "vi": "Tôi gọt táo thành hình con thỏ."}], "usage": {"collocations": [], "compounds": ["予算カット", "コストカット", "経費カット", "賃金カット", "ノーカット", "ノイズカット", "ヘアカット", "ショートカット", "カットグラス"], "antonyms": [], "related": ["ヲ切る", "カッター（ナイフ）"], "synonyms": ["ヲ削る", "ヲ削減スル", "ヲ除去スル", "ヲ削除スル"]}}, {"no": 829, "section": "Unit 09 カタカナB", "kana": "カバー", "word": "カバー", "form_note": "ヲ〜（ヲ）スル；関「覆う」☞778", "meaning_en": "cover; making up for; covering", "meaning_vi": "bao, vỏ bọc; bù đắp, hỗ trợ; bao phủ (phạm vi)", "examples": [{"jp_ruby": "ソファーをカバーで<ruby>覆<rt>おお</rt></ruby>う。", "vi": "Phủ ghế sofa bằng tấm phủ."}, {"jp_ruby": "<ruby>服<rt>ふく</rt></ruby>にカバーを｛して／かけて｝たんすにしまう。", "vi": "Bọc quần áo bằng túi bọc rồi cất vào tủ."}, {"jp_ruby": "私の仕事のミスを<ruby>同僚<rt>どうりょう</rt></ruby>がカバーしてくれた。", "vi": "Đồng nghiệp đã đỡ đần cho lỗi của tôi trong công việc."}, {"jp_ruby": "この<ruby>選手<rt>せんしゅ</rt></ruby>は<ruby>小柄<rt>こがら</rt></ruby>な<ruby>体格<rt>たいかく</rt></ruby>を優れたテクニックでカバーしている。", "vi": "Vận động viên này dùng kỹ thuật xuất sắc để bù đắp cho thể hình nhỏ bé của mình."}, {"jp_ruby": "<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>の<ruby>電波<rt>でんぱ</rt></ruby>は、ほとんど<ruby>全国<rt>ぜんこく</rt></ruby>をカバーしている。", "vi": "Sóng điện thoại di động bao phủ hầu như khắp toàn quốc."}], "usage": {"collocations": ["〜にカバーをかける"], "compounds": ["洋服カバー", "枕カバー", "ブックカバー"], "antonyms": [], "related": ["ヲ覆う"], "synonyms": ["覆い（おおい）", "ヲ補う"]}}, {"no": 830, "section": "Unit 09 カタカナB", "kana": "リハビリ", "word": "リハビリ", "form_note": "dạng đầy đủ: リハビリテーション", "meaning_en": "rehabilitation", "meaning_vi": "phục hồi chức năng, tập vật lý trị liệu", "examples": [{"jp_ruby": "<ruby>骨折<rt>こっせつ</rt></ruby>で<ruby>入院<rt>にゅういん</rt></ru : [], "related": [], "synonyms": ["爽快な"]}}, {"no": 845, "section": "Unit 10 形容詞B", "kana": "すなおな", "word": "素直な", "form_note": "", "meaning_en": "gentle, mild; obedient", "meaning_vi": "hiền lành, dịu dàng; ngoan ngoãn, biết nghe lời", "examples": [{"jp_ruby": "この<ruby>童話<rt>どうわ</rt></ruby>を<ruby>読<rt>よ</rt></ruby>むと、<ruby>子<rt>こ</rt></ruby>どものような<ruby>素直<rt>すなお</rt></ruby>な<ruby>気持<rt>きも</rt></ruby>ちになれる。", "vi": "Đọc truyện cổ tích này, ta có thể trở về với cảm xúc thuần hậu như một đứa trẻ."}, {"jp_ruby": "いつも<ruby>反抗的<rt>はんこうてき</rt></ruby>な<ruby>学生<rt>がくせい</rt></ruby>が、<ruby>今日<rt>きょう</rt></ruby>は<ruby>素直<rt>すなお</rt></ruby>だ。", "vi": "Cậu học sinh lúc nào cũng chống đối, vậy mà hôm nay lại ngoan ngoãn."}, {"jp_ruby": "<ruby>彼女<rt>かのじょ</rt></ruby>はいくら<ruby>自分<rt>じぶん</rt></ruby>が<ruby>悪<rt>わる</rt></ruby>くても<ruby>素直<rt>すなお</rt></ruby>に<ruby>認<rt>みと</rt></ruby>めない。", "vi": "Dù bản thân có sai đến đâu, cô ấy cũng không chịu thành thật thừa nhận."}, {"jp_ruby": "<ruby>優勝<rt>ゆうしょう</rt></ruby>したが、<ruby>試合<rt>しあい</rt></ruby>の<ruby>内容<rt>ないよう</rt></ruby>が<ruby>良<rt>よ</rt></ruby>くないので<ruby>素直<rt>すなお</rt></ruby>に<ruby>喜<rt>よろこ</rt></ruby>べない。", "vi": "Dù đã vô địch nhưng nội dung trận đấu không tốt nên không thể vui mừng một cách trọn vẹn."}], "usage": {"collocations": ["素直な｛人／性格／心／態度 …｝"], "compounds": ["①②素直さ"], "antonyms": ["頑固な（☛265）", "反抗的な", "ひねくれた"], "related": ["純情な", "純真な", "従順な"], "synonyms": []}}, {"no": 846, "section": "Unit 10 形容詞B", "kana": "そっちょくな", "word": "率直な", "form_note": "", "meaning_en": "frank, straightforward", "meaning_vi": "thẳng thắn, bộc trực", "examples": [{"jp_ruby": "<ruby>彼<rt>かれ</rt></ruby>は<ruby>率直<rt>そっちょく</rt></ruby>な<ruby>人<rt>ひと</rt></ruby>で、<ruby>言<rt>い</rt></ruby>うべきことをきちんと<ruby>言<rt>い</rt></ruby>う。", "vi": "Anh ấy là người thẳng thắn, điều cần nói thì nói cho rõ ràng."}], "usage": {"collocations": ["率直な｛考え／感想／意見／反応 …｝", "率直に｛話す／述べる／わびる …｝"], "compounds": ["率直さ"], "antonyms": [], "related": ["正直な", "単刀直入な"], "synonyms": []}}, {"no": 847, "section": "Unit 10 形容詞B", "kana": "せいじつな", "word": "誠実な", "form_note": "", "meaning_en": "honest", "meaning_vi": "chân thành, thành thật", "examples": [{"jp_ruby": "<ruby>男女<rt>だんじょ</rt></ruby>とも、「<ruby>誠実<rt>せいじつ</rt></ruby>な<ruby>人<rt>ひと</rt></ruby>と<ruby>結婚<rt>けっこん</rt></ruby>したい」という<ruby>若者<rt>わかもの</rt></ruby>が<ruby>多<rt>おお</rt></ruby>い。", "vi": "Cả nam lẫn nữ, nhiều người trẻ đều nói rằng muốn kết hôn với một người chân thành."}, {"jp_ruby": "<ruby>誠実<rt>せいじつ</rt></ruby>な<ruby>人柄<rt>ひとがら</rt></ruby>", "vi": "Nhân cách chân thành."}], "usage": {"collocations": [], "compounds": ["誠実さ"], "antonyms": ["不誠実な"], "related": ["真面目な"], "synonyms": []}}, {"no": 848, "section": "Unit 10 形容詞B", "kana": "けんきょな", "word": "謙虚な", "form_note": "", "meaning_en": "modest", "meaning_vi": "khiêm tốn", "examples": [{"jp_ruby": "<ruby>彼<rt>かれ</rt></ruby>は<ruby>謙虚<rt>けんきょ</rt></ruby>な<ruby>人柄<rt>ひとがら</rt></ruby>だ。", "vi": "Anh ấy là người có nhân cách khiêm tốn."}, {"jp_ruby": "「<ruby>自分<rt>じぶん</rt></ruby>が<ruby>偉<rt>えら</rt></ruby>いと<ruby>思<rt>おも</rt></ruby>わず<ruby>謙虚<rt>けんきょ</rt></ruby>になりなさい」", "vi": "“Đừng tưởng mình giỏi giang, hãy học cách khiêm tốn đi.”"}], "usage": {"collocations": ["謙虚な｛人／気持ち／態度／姿勢 …｝", "謙虚に｛反省する／人の話に耳を傾ける …｝", "謙虚になる"], "compounds": ["謙虚さ"], "antonyms": [], "related": [], "synonyms": []}}, {"no": 849, "section": "Unit 10 形容詞B", "kana": "かしこい", "word": "賢い", "form_note": "", "meaning_en": "wise, clever", "meaning_vi": "thông minh, khôn ngoan", "examples": [{"jp_ruby": "こんな<ruby>難<rt>むずか</rt></ruby>しい<ruby>話<rt>はなし</rt></ruby>が<ruby>理解<rt>りかい</rt></ruby>できるとは<ruby>賢<rt>かしこ</rt></ruby>い<ruby>子<rt>こ</rt></ruby>だ。", "vi": "Hiểu được câu chuyện khó như thế này, đúng là một đứa trẻ thông minh."}, {"jp_ruby": "<ruby>物<rt>もの</rt></ruby>があふれているなか、<ruby>賢<rt>かしこ</rt></ruby>い<ruby>消費者<rt>しょうひしゃ</rt></ruby>にならなければいけない。", "vi": "Giữa thời buổi hàng hóa tràn ngập, ta phải trở thành người tiêu dùng khôn ngoan."}], "usage": {"collocations": [], "compounds": ["①②賢さ"], "antonyms": [], "related": [], "synonyms": ["賢明な", "①②利口な"]}}, {"no": 850, "section": "Unit 10 形容詞B", "kana": "しんちょうな", "word": "慎重な", "form_note": "", "meaning_en": "prudent, cautious", "meaning_vi": "thận trọng, cẩn trọng", "examples": [{"jp_ruby": "<ruby>私<rt>わたし</rt></ruby>は<ruby>慎重<rt>しんちょう</rt></ruby>な<ruby>性格<rt>せいかく</rt></ruby>なので、よく<ruby>考<rt>かんが</rt></ruby>えてからでなければ<ruby>行動<rt>こうどう</rt></ruby>しない。", "vi": "Vì tính tôi thận trọng nên nếu không suy nghĩ kỹ trước thì tôi sẽ không hành động."}, {"jp_ruby": "<ruby>景気<rt>けいき</rt></ruby>の<ruby>回復<rt>かいふく</rt></ruby>について<ruby>専門家<rt>せんもんか</rt></ruby>は<ruby>慎重<rt>しんちょう</rt></ruby>な<ruby>見方<rt>みかた</rt></ruby>をしている。", "vi": "Về vấn đề phục hồi kinh tế, các chuyên gia đang giữ cái nhìn thận trọng."}], "usage": {"collocations": ["慎重な｛人／態度／姿勢／行動／やり方／判断／対応 …｝", "慎重に｛考える／選ぶ／扱う …｝"], "compounds": ["慎重さ"], "antonyms": ["軽率な", "軽々しい"], "related": ["優柔不断な"], "synonyms": ["注意深い"]}}, {"no": 851, "section": "Unit 10 形容詞B", "kana": "おだやかな", "word": "穏やかな", "form_note": "", "meaning_en": "calm, quiet", "meaning_vi": "ôn hòa, êm đềm; yên tĩnh", "examples": [{"jp_ruby": "このあたりは<ruby>気候<rt>きこう</rt></ruby>が<ruby>穏<rt>おだ</rt></ruby>やかで<ruby>住<rt>す</rt></ruby>みやすい。", "vi": "Khu vực này khí hậu ôn hòa nên dễ sống."}, {"jp_ruby": "「<ruby>大<rt>おお</rt></ruby>きな<ruby>声<rt>こえ</rt></ruby>を<ruby>出<rt>だ</rt></ruby>さないでください。<ruby>穏<rt>おだ</rt></ruby>やかに<ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>いましょう」", "vi": "“Xin đừng nói to. Chúng ta hãy bình tĩnh nói chuyện với nhau.”"}], "usage": {"collocations": ["穏やかな｛天気／海／一日／性格／人 …｝"], "compounds": ["穏やかさ"], "antonyms": [], "related": ["平穏な", "円満な", "静かな"], "synonyms": []}}, {"no": 852, "section": "Unit 10 形容詞B", "kana": "しんけんな", "word": "真剣な", "form_note": "", "meaning_en": "serious", "meaning_vi": "nghiêm túc, nghiêm chỉnh", "examples": [{"jp_ruby": "<ruby>二人<rt>ふたり</rt></ruby>は<ruby>結婚<rt>けっこん</rt></ruby>するつもりで<ruby>真剣<rt>しんけん</rt></ruby>につき<ruby>合<rt>あ</rt></ruby>っている。", "vi": "Hai người họ đang hẹ ": 858, "section": "Unit 10 形容詞B", "kana": "えらい", "word": "偉い", "form_note": "", "meaning_en": "great, admirable; in a high position", "meaning_vi": "giỏi giang, đáng khâm phục; có chức vị cao", "examples": [{"jp_ruby": "<ruby>卒業式<rt>そつぎょうしき</rt></ruby>には<ruby>市長<rt>しちょう</rt></ruby>や<ruby>大臣<rt>だいじん</rt></ruby>など<ruby>偉<rt>えら</rt></ruby>い<ruby>人<rt>ひと</rt></ruby>が<ruby>来<rt>き</rt></ruby>ていた。", "vi": "Tại lễ tốt nghiệp, có những người giữ chức vụ cao như thị trưởng và bộ trưởng tới dự."}, {"jp_ruby": "<ruby>貧<rt>まず</rt></ruby>しい<ruby>人<rt>ひと</rt></ruby>を<ruby>助<rt>たす</rt></ruby>け<ruby>続<rt>つづ</rt></ruby>けた<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>偉<rt>えら</rt></ruby>いと<ruby>思<rt>おも</rt></ruby>う。", "vi": "Tôi nghĩ cô ấy thật đáng khâm phục vì đã luôn giúp đỡ những người nghèo."}], "usage": {"collocations": [], "compounds": ["①②偉さ"], "antonyms": [], "related": [], "synonyms": ["立派な"]}}, {"no": 859, "section": "Unit 10 形容詞B", "kana": "どくとくな", "word": "独特な", "form_note": "※「独特の」という形もよく使われる", "meaning_en": "unique, peculiar", "meaning_vi": "độc đáo, đặc trưng; kỳ lạ", "examples": [{"jp_ruby": "ブルーチーズには<ruby>独特<rt>どくとく</rt></ruby>な<ruby>香<rt>かお</rt></ruby>りがある。", "vi": "Phô mai mốc xanh có mùi hương độc đáo riêng."}], "usage": {"collocations": ["独特な｛方法／表現／文体／考え …｝"], "compounds": [], "antonyms": [], "related": [], "synonyms": ["独自な", "特有な", "固有な"]}}, {"no": 860, "section": "Unit 10 形容詞B", "kana": "とくしゅな", "word": "特殊な", "form_note": "", "meaning_en": "special, particular", "meaning_vi": "đặc biệt, đặc thù", "examples": [{"jp_ruby": "この<ruby>仕事<rt>しごと</rt></ruby>には<ruby>特殊<rt>とくしゅ</rt></ruby>な<ruby>技能<rt>ぎのう</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>だ。", "vi": "Công việc này đòi hỏi kỹ năng đặc biệt."}], "usage": {"collocations": ["特殊な｛物質／能力／職業／事情／例／ケース …｝"], "compounds": ["特殊性", "特殊撮影"], "antonyms": ["普通の", "一般的な", "普遍的な"], "related": [], "synonyms": ["特別な", "独特な"]}}, {"no": 861, "section": "Unit 10 形容詞B", "kana": "きみょうな", "word": "奇妙な", "form_note": "", "meaning_en": "strange, odd", "meaning_vi": "kỳ lạ, quái lạ", "examples": [{"jp_ruby": "この<ruby>魚<rt>さかな</rt></ruby>は<ruby>奇妙<rt>きみょう</rt></ruby>な<ruby>形<rt>かたち</rt></ruby>をしている。", "vi": "Con cá này có hình dạng kỳ lạ."}, {"jp_ruby": "「<ruby>昨日<rt>きのう</rt></ruby>の<ruby>夜<rt>よる</rt></ruby>、<ruby>近所中<rt>きんじょじゅう</rt></ruby>の<ruby>猫<rt>ねこ</rt></ruby>がいっせいに<ruby>鳴<rt>な</rt></ruby>いたんですよ」「それは<ruby>奇妙<rt>きみょう</rt></ruby>ですね」", "vi": "“Đêm qua, mèo trong khắp khu phố đồng loạt kêu lên đấy.” “Thật là kỳ lạ nhỉ.”"}], "usage": {"collocations": ["奇妙な｛人／話／できごと …｝"], "compounds": ["奇妙さ"], "antonyms": [], "related": ["不思議な"], "synonyms": ["妙な", "変な"]}}, {"no": 862, "section": "Unit 10 形容詞B", "kana": "みょうな", "word": "妙な", "form_note": "", "meaning_en": "strange; curious", "meaning_vi": "lạ, kỳ lạ; lạ lùng", "examples": [{"jp_ruby": "<ruby>妙<rt>みょう</rt></ruby>なことに、<ruby>初<rt>はじ</rt></ruby>めて<ruby>来<rt>き</rt></ruby>たこの<ruby>場所<rt>ばしょ</rt></ruby>をなんだか<ruby>知<rt>し</rt></ruby>っているような<ruby>気<rt>き</rt></ruby>がする。", "vi": "Lạ một điều là, dù mới đến nơi này lần đầu, tôi lại có cảm giác như mình đã biết nó."}, {"jp_ruby": "<ruby>私<rt>わたし</rt></ruby>と<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>性格<rt>せいかく</rt></ruby>も<ruby>育<rt>そだ</rt></ruby>った<ruby>環境<rt>かんきょう</rt></ruby>も<ruby>違<rt>ちが</rt></ruby>うが、<ruby>妙<rt>みょう</rt></ruby>に<ruby>気<rt>き</rt></ruby>が<ruby>合<rt>あ</rt></ruby>う。", "vi": "Tôi và cô ấy tính cách cũng như môi trường trưởng thành đều khác nhau, nhưng lạ thay lại rất hợp nhau."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": ["不思議な"], "synonyms": ["奇妙な", "変な"]}}, {"no": 863, "section": "Unit 10 形容詞B", "kana": "あやしい", "word": "怪しい", "form_note": "（動）①〜③ ヲ怪しむ", "meaning_en": "suspicious; questionable; uncertain; not promising", "meaning_vi": "khả nghi, đáng ngờ; không chắc chắn; không hứa hẹn (không ổn)", "examples": [{"jp_ruby": "<ruby>家<rt>いえ</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>をあやしい<ruby>男<rt>おとこ</rt></ruby>がうろうろしている。", "vi": "Một người đàn ông khả nghi đang lảng vảng trước nhà."}, {"jp_ruby": "その<ruby>情報<rt>じょうほう</rt></ruby>はあやしいと<ruby>思<rt>おも</rt></ruby>う。<ruby>情報源<rt>じょうほうげん</rt></ruby>はどこだろう。", "vi": "Tôi cho rằng thông tin đó đáng ngờ. Không biết nguồn tin là ở đâu."}, {"jp_ruby": "<ruby>彼女<rt>かのじょ</rt></ruby>の<ruby>日本語力<rt>にほんごりょく</rt></ruby>はかなりあやしい。<ruby>通訳<rt>つうやく</rt></ruby>は<ruby>無理<rt>むり</rt></ruby>だろう。", "vi": "Năng lực tiếng Nhật của cô ấy khá là đáng ngờ. Có lẽ không thể làm phiên dịch được."}, {"jp_ruby": "「<ruby>雲<rt>くも</rt></ruby>が<ruby>出<rt>で</rt></ruby>てきた。<ruby>明日<rt>あした</rt></ruby>の<ruby>天気<rt>てんき</rt></ruby>はあやしいぞ」", "vi": "“Mây kéo tới rồi. Thời tiết ngày mai có vẻ không ổn đâu.”"}], "usage": {"collocations": [], "compounds": ["①〜④怪しさ"], "antonyms": [], "related": [], "synonyms": ["不審な"]}}, {"no": 864, "section": "Unit 10 形容詞B", "kana": "いじょうな", "word": "異常な", "form_note": "※関連語「異状」は名詞としてだけ使う", "meaning_en": "unusual; abnormal", "meaning_vi": "bất thường; dị thường", "examples": [{"jp_ruby": "<ruby>今年<rt>ことし</rt></ruby>の<ruby>夏<rt>なつ</rt></ruby>の<ruby>暑<rt>あつ</rt></ruby>さは<ruby>異常<rt>いじょう</rt></ruby>だ。", "vi": "Cái nóng của mùa hè năm nay thật bất thường."}, {"jp_ruby": "<ruby>認知症<rt>にんちしょう</rt></ruby>の<ruby>祖父<rt>そふ</rt></ruby>に<ruby>異常<rt>いじょう</rt></ruby>な<ruby>言動<rt>げんどう</rt></ruby>が<ruby>見<rt>み</rt></ruby>られるようになった。", "vi": "Người ông mắc chứng sa sút trí tuệ bắt đầu có những lời nói và hành động bất thường."}, {"jp_ruby": "<ruby>医者<rt>いしゃ</rt></ruby>に「<ruby>白血球<rt>はっけっきゅう</rt></ruby>が<ruby>異常<rt>いじょう</rt></ruby>に<ruby>多<rt>おお</rt></ruby>い」と<ruby>言<rt>い</rt></ruby>われた。", "vi": "Tôi được bác sĩ nói rằng “số lượng bạch cầu cao bất thường”."}, {"jp_ruby": "<ruby>異状<rt>いじょう</rt></ruby>なし。", "vi": "Không có gì bất thường."}, {"jp_ruby": "<ruby>検査<rt>けんさ</rt></ruby>の<ruby>結果<rt>けっか</rt></ruby>、<ruby>胃<rt>い</rt></ruby>に<ruby>異状<rt>いじょう</rt></ruby>は<ruby>認<rt>みと</rt></ruby>められなかった。", "vi": "Kết quả kiểm tra cho thấy không phát hiện bất thường nào ở dạ dày."}], "usage": {"collocations": [], "compounds": ["異常さ", "異常気象", "異常性"], "a る"], "related": [], "synonyms": []}}, {"no": 1019, "section": "Unit 12 動詞C", "kana": "すする", "word": "すする", "form_note": "ヲ〜", "meaning_en": "slurp; sniffle", "meaning_vi": "húp (xì xụp); sụt sịt, hít (nước mũi)", "examples": [{"jp_ruby": "そばを<ruby>音<rt>おと</rt></ruby>をたててすする。", "vi": "Húp mì soba phát ra tiếng xì xụp."}, {"jp_ruby": "｛お<ruby>茶<rt>ちゃ</rt></ruby>／<ruby>汁<rt>しる</rt></ruby>…｝をすする。", "vi": "Húp {trà / nước súp...}."}, {"jp_ruby": "｛<ruby>鼻<rt>はな</rt></ruby>／<ruby>鼻水<rt>はなみず</rt></ruby>｝をすする。", "vi": "Sụt sịt mũi, hít nước mũi."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1020, "section": "Unit 12 動詞C", "kana": "あじわう", "word": "味わう", "form_note": "ヲ〜; (名）味わい", "meaning_en": "taste, enjoy; appreciate, experience", "meaning_vi": "nếm, thưởng thức; trải nghiệm, nếm trải", "examples": [{"jp_ruby": "<ruby>久<rt>ひさ</rt></ruby>しぶりにふるさとの<ruby>料理<rt>りょうり</rt></ruby>をゆっくり<ruby>味<rt>あじ</rt></ruby>わうことができた。", "vi": "Sau một thời gian dài, tôi đã có thể thong thả thưởng thức món ăn quê nhà."}, {"jp_ruby": "｛<ruby>快感<rt>かいかん</rt></ruby>／<ruby>苦<rt>く</rt></ruby>しみ／<ruby>悲<rt>かな</rt></ruby>しみ…｝を<ruby>味<rt>あじ</rt></ruby>わう。", "vi": "Nếm trải {khoái cảm / nỗi khổ / nỗi buồn...}."}, {"jp_ruby": "<ruby>忙<rt>いそが</rt></ruby>しくて<ruby>旅行<rt>りょこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>けないので、ガイドブックを<ruby>見<rt>み</rt></ruby>て<ruby>旅行気分<rt>りょこうきぶん</rt></ruby>を<ruby>味<rt>あじ</rt></ruby>わっている。", "vi": "Vì bận không đi du lịch được nên tôi xem sách hướng dẫn để tận hưởng không khí du lịch."}, {"jp_ruby": "この<ruby>歌<rt>うた</rt></ruby>にはしみじみとした<ruby>味<rt>あじ</rt></ruby>わいがある。", "vi": "Bài hát này có một dư vị sâu lắng."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1021, "section": "Unit 12 動詞C", "kana": "におう", "word": "匂う", "form_note": "ガ〜; (名）①②におい", "meaning_en": "smell", "meaning_vi": "có mùi, tỏa mùi; (nghĩa bóng) có vẻ khả nghi, có mùi mờ ám", "examples": [{"jp_ruby": " gia đình và bạn bè đã nâng đỡ tôi."}, {"jp_ruby": "<ruby>木<rt>き</rt></ruby>の<ruby>枝<rt>えだ</rt></ruby>に<ruby>支<rt>ささ</rt></ruby>えをする。", "vi": "Làm giá đỡ cho cành cây."}, {"jp_ruby": "<ruby>子<rt>こ</rt></ruby>どもが<ruby>私<rt>わたし</rt></ruby>の<ruby>心<rt>こころ</rt></ruby>の<ruby>支<rt>ささ</rt></ruby>えになっている。", "vi": "Con là chỗ dựa tinh thần của tôi."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1027, "section": "Unit 12 動詞C", "kana": "ついやす", "word": "費やす", "form_note": "ヲ〜", "meaning_en": "spend", "meaning_vi": "tiêu tốn, dành (thời gian, tiền bạc, công sức)", "examples": [{"jp_ruby": "<ruby>週末<rt>しゅうまつ</rt></ruby>の<ruby>時間<rt>じかん</rt></ruby>のほとんどを<ruby>趣味<rt>しゅみ</rt></ruby>に<ruby>費<rt>つい</rt></ruby>やしている。", "vi": "Tôi dành gần như toàn bộ thời gian cuối tuần cho sở thích."}, {"jp_ruby": "｛<ruby>時間<rt>じかん</rt></ruby>／お<ruby>金<rt>かね</rt></ruby>／<ruby>労力<rt>ろうりょく</rt></ruby>…｝を<ruby>費<rt>つい</rt></ruby>やす。", "vi": "Tiêu tốn {thời gian / tiền bạc / công sức...}."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": ["ヲかける"], "synonyms": ["ヲ使う"]}}, {"no": 1028, "section": "Unit 12 動詞C", "kana": "もちいる", "word": "用いる", "form_note": "ヲ〜", "meaning_en": "use, utilize; adopt; employ", "meaning_vi": "sử dụng, dùng; áp dụng (phương án); trọng dụng (người)", "examples": [{"jp_ruby": "<ruby>携帯電話<rt>けいたいでんわ</rt></ruby>は<ruby>今<rt>いま</rt></ruby>や<ruby>広<rt>ひろ</rt></ruby>く<ruby>用<rt>もち</rt></ruby>いられている。", "vi": "Ngày nay điện thoại di động được sử dụng rộng rãi."}, {"jp_ruby": "<ruby>新<rt>あたら</rt></ruby>しい<ruby>方法<rt>ほうほう</rt></ruby>を<ruby>用<rt>もち</rt></ruby>いてやってみよう。", "vi": "Hãy thử làm bằng phương pháp mới."}, {"jp_ruby": "<ruby>私<rt>わたし</rt></ruby>の<ruby>案<rt>あん</rt></ruby>が<ruby>用<rt>もち</rt></ruby>いられて<ruby>感激<rt>かんげき</rt></ruby>だ。", "vi": "Tôi rất cảm kích vì phương án của mình đã được áp dụng."}, {"jp_ruby": "<ruby>最近<rt>さいきん</rt></ruby><ruby>彼<rt>かれ</rt></ruby>は<ruby>社長<rt>しゃちょう</rt></ruby>に<ruby>重<rt>おも</rt></ruby>く<ruby>用<rt>もち</rt></ruby>いられている。", "vi": "Dạo này anh ấy được giám đốc trọng dụng."}, {"jp_ruby": "これからは<ruby>大<rt>おお</rt></ruby>いに<ruby>若手<rt>わかて</rt></ruby>を<ruby>用<rt>もち</rt></ruby>いようと<ruby>思<rt>おも</rt></ruby>う。", "vi": "Từ nay tôi định sẽ trọng dụng nhiều lớp trẻ."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["ヲ使う", "ヲ使用する", "ヲ重用する", "ヲ登用する", "ヲ任用する"]}}, {"no": 1029, "section": "Unit 12 動詞C", "kana": "あらたまる", "word": "改まる", "form_note": "ガ〜", "meaning_en": "be improved; be replaced; formal", "meaning_vi": "được sửa đổi, cải thiện; đổi mới (năm, quy tắc); trang trọng, trịnh trọng", "examples": [{"jp_ruby": "あの<ruby>学生<rt>がくせい</rt></ruby>は<ruby>何度<rt>なんど</rt></ruby><ruby>注意<rt>ちゅうい</rt></ruby>しても<ruby>態度<rt>たいど</rt></ruby>が<ruby>改<rt>あらた</rt></ruby>まらない。", "vi": "Học sinh đó dù bị nhắc nhở bao nhiêu lần, thái độ vẫn không sửa đổi."}, {"jp_ruby": "｛<ruby>年<rt>とし</rt></ruby>／<ruby>規則<rt>きそく</rt></ruby>…｝が<ruby>改<rt>あらた</rt></ruby>まる。", "vi": "{Sang năm mới / quy tắc thay đổi...}."}, {"jp_ruby": "<ruby>改<rt>あらた</rt></ruby>まった｛<ruby>態度<rt>たいど</rt></ruby>／<ruby>言葉遣<rt>ことばづか</rt></ruby>い／<ruby>服装<rt>ふくそう</rt></ruby>／<ruby>場<rt>ば</rt></ruby>…｝", "vi": "{Thái độ / cách ăn nói / trang phục / hoàn cảnh...} trang trọng, trịnh trọng."}, {"jp_ruby": "「おじさん、お<ruby>話<rt>はなし</rt></ruby>があるんですが」「<ruby>何<rt>なん</rt></ruby>だい、<ruby>改<rt>あらた</rt></ruby>まって」", "vi": "「Chú ơi, cháu có chuyện muốn nói ạ」「Gì thế, sao mà trịnh trọng vậy」"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["ガ直る"]}}, {"no": 1030, "section": "Unit 12 動詞C", "kana": "あらためる", "word": "改める", "form_note": "ヲ〜; ⑥(副）改めて", "meaning_en": "improve; replace; (dress) properly; (come) again; check; some other time", "meaning_vi": "sửa đổi, cải thiện; đổi, thay mới; chỉnh tề (trang phục); để dịp khác, hôm khác; kiểm tra, soát (vé)", "examples": [{"jp_ruby": "「その<ruby>遅刻癖<rt>ちこくぐせ</rt></ruby>を<ruby>改<rt>あらた</rt></ruby>めないと、<ruby>信用<rt>しんよう</rt></ruby>をなくしますよ」", "vi": "「Nếu không sửa cái tật hay đi muộn đó thì sẽ mất uy tín đấy」"}, {"jp_ruby": "<ruby>会社<rt>かいしゃ</rt></ruby>の<ruby>名前<rt>なまえ</rt></ruby>を「○○」から「△△」に<ruby>改<rt>あらた</rt></ruby>めた。", "vi": "Tôi đã đổi tên công ty từ「○○」thành「△△」."}, {"jp_ruby": "<ruby>夕方<rt>ゆうがた</rt></ruby>から<ruby>友人<rt>ゆうじん</rt></ruby>の<ruby>結婚式<rt>けっこんしき</rt></ruby>に<ruby>出席<rt>しゅっせき</rt></ruby>するので、<ruby>会社<rt>かいしゃ</rt></ruby>を<ruby>出<rt>で</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に<ruby>服装<rt>ふくそう</rt></ruby>を<ruby>改<rt>あらた</rt></ruby>めた。", "vi": "Vì chiều nay dự đám cưới của bạn nên trước khi rời công ty, tôi đã thay bộ trang phục chỉnh tề."}, {"jp_ruby": "「<ruby>今日<rt>きょう</rt></ruby>はお<ruby>忙<rt>いそが</rt></ruby>しいようですから、また<ruby>日<rt>ひ</rt></ruby>を<ruby>改<rt>あらた</rt></ruby>めてご<ruby>相談<rt>そうだん</rt></ruby>に<ruby>伺<rt>うかが</rt></ruby>います」", "vi": "「Hôm nay có vẻ anh/chị đang bận, tôi sẽ đến bàn lại vào một ngày khác」"}, {"jp_ruby": "（<ruby>車掌<rt>しゃしょう</rt></ruby>が<ruby>乗客<rt>じょうきゃく</rt></ruby>に）「すみませんが、<ruby>特急券<rt>とっきゅうけん</rt></ruby>を<ruby>改<rt>あらた</rt></ruby>めさせていただきます」", "vi": "(Nhân viên soát vé nói với hành khách) 「Xin lỗi, cho phép tôi kiểm tra vé tàu tốc hành của quý khách」"}, {"jp_ruby": "「<ruby>今日<rt>きょう</rt></ruby>は、ありがとうございました。<ruby>改<rt>あらた</rt></ruby>めてお<ruby>礼<rt>れい</rt></ruby>に<ruby>伺<rt>うかが</rt></ruby>います」", "vi": "「Hôm nay xin chân thành cảm ơn. Tôi sẽ đến cảm ơn lại vào một dịp khác」"}, {"jp_ruby": "あの<ruby>時<rt>とき</rt></ruby>は<ruby>腹<rt>はら</rt></ruby>が<ruby>立<rt>た</rt></ruby>ったが、<ruby>改<rt>あらた</rt></ruby>めて<ruby>考<rt>かんが</rt></ruby>えてみると、<ruby>私<rt>わたし</rt></ruby>にも<ruby>落<rt>お</rt></ruby>ち<ruby>度<rt>ど</rt></ruby>があったかもしれない。", "vi": "Lúc đó tôi đã rất tức giận, nhưng nghĩ lại thì có lẽ bản thân tôi cũng có phần lỗi."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["ヲ直す"]}}, {"no": 1031, "section": "Unit 12 動詞C", "kana": "おさまる", "word": "収まる／納まる／治まる", "form_note": "ガ〜", "meaning_en": "fit; be settled; go away; calm down", "meaning_vi": "vừa, gọn vào (trong khung, ngân sách); lắng xuống, yên ổn (ồn ào, cơn giận); thuyên giảm (bệnh, cơn đau); thái bình (đất nước)", "examples": [{"jp_ruby": "<ruby>本<rt>ほん</rt></ruby>が<ruby>増<rt>ふ</rt></ruby>えて、<ruby>本棚<rt>ほんだな</rt></ruby>に<ruby>収<rt>おさ</rt></ruby>（<ruby>納<rt>おさ</rt></ruby>）まらなくなった。", "vi": "Sách nhiều lên, không còn vừa tủ sách nữa."}, {"jp_ruby": "<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>費用<rt>ひよう</rt></ruby>は<ruby>予算内<rt>よさんない</rt></ruby>に<ruby>収<rt>おさ</rt></ruby>まった。", "vi": "Chi phí chuyến đi đã nằm gọn trong ngân sách."}, {"jp_ruby": "<ruby>警官<rt>けいかん</rt></ruby>が<ruby>大勢<rt>おおぜい</rt></ruby><ruby>来<rt>き</rt></ruby>て、ようやく<ruby>騒<rt>さわ</rt></ruby>ぎが<ruby>収<rt>おさ</rt></ruby>まった。", "vi": "Nhiều cảnh sát đến, cuối cùng vụ náo loạn cũng lắng xuống."}, {"jp_ruby": "｛<ruby>嵐<rt>あらし</rt></ruby>／<ruby>風<rt>かぜ</rt></ruby>／ふるえ…｝が<ruby>収<rt>おさ</rt></ruby>まる。", "vi": "{Bão / gió / cơn run rẩy...} lắng xuống."}, {"jp_ruby": "<ruby>父<rt>ちち</rt></ruby>の<ruby>怒<rt>いか</rt></ruby>りはなかなか<ruby>収<rt>おさ</rt></ruby>（<ruby>治<rt>おさ</rt></ruby>）まらなかった。", "vi": "Cơn giận của cha mãi vẫn không nguôi."}, {"jp_ruby": "<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んだら｛<ruby>頭痛<rt>ずつう</rt></ruby>／<ruby>熱<rt>ねつ</rt></ruby>／せき…｝が<ruby>治<rt>おさ</rt></ruby>まった。", "vi": "Uống thuốc vào thì {đau đầu / sốt / ho...} đã thuyên giảm."}, {"jp_ruby": "<ruby>戦後<rt>せんご</rt></ruby><ruby>20年<rt>にじゅうねん</rt></ruby>が<ruby>過<rt>す</rt></ruby>ぎ、ようやく<ruby>国内<rt>こくない</rt></ruby>が<ruby>治<rt>おさ</rt></ruby>まった。", "vi": "20 năm sau chiến tranh trôi qua, cuối cùng tình hình trong nước mới yên ổn."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["ガ静まる", "ガ鎮まる"]}}, {"no": 1032, "section": "Unit 12 動詞C", "kana": "おさめる", "word": "収める／納める／治める", "form_note": "ヲ〜", "meaning_en": "put, keep; settle; obtain; pay; deliver", "meaning_vi": "cất vào, thu xếp gọn vào; dàn xếp, làm lắng xuống; đạt được, giành được; nộp (thuế, phí); giao (hàng); cai trị", "examples": [{"jp_ruby": "<ruby>貴重品<rt>きちょうひん</rt></ruby>を<ruby>金庫<rt>きんこ</rt></ruby>に<ruby>収<rt>おさ</rt></ruby>（<ruby>納<rt>おさ</rt></ruby>）めた。", "vi": "Tôi đã cất đồ quý giá vào két sắt."}, {"jp_ruby": "<ruby>費用<rt>ひよう</rt></ruby>を<ruby>予算内<rt>よさんない</rt></ruby>に<ruby>収<rt>おさ</rt></ruby>めようと<ruby>苦労<rt>くろう</rt></ruby>した。", "vi": "Tôi đã vất vả để giữ chi phí trong phạm vi ngân sách."}, {"jp_ruby": "<ruby>先生<rt>せんせい</rt></ruby>は<ruby>子<rt>こ</rt></ruby>どもたちのけんかをうまく<ruby>収<rt>おさ</rt></ruby>めた。", "vi": "Thầy giáo đã khéo léo dàn xếp vụ cãi vã của bọn trẻ."}, {"jp_ruby": "<ruby>争<rt>あらそ</rt></ruby>いをおさめる。", "vi": "Dàn xếp cuộc tranh chấp."}, {"jp_ruby": "｛<ruby>成功<rt>せいこう</rt></ruby>／<ruby>勝利<rt>しょうり</rt></ruby>／<ruby>良<rt>よ</rt></ruby>い<ruby>成績<rt>せいせき</rt></ruby>…｝を<ruby>収<rt>おさ</rt></ruby>める。", "vi": "Đạt được {thành công / chiến thắng / thành tích tốt...}."}, {"jp_ruby": "｛<ruby>税金<rt>ぜいきん</rt></ruby>／<ruby>会費<rt>かいひ</rt></ruby>…｝を<ruby>納<rt>おさ</rt></ruby>める。", "vi": "Nộp {thuế / hội phí...}."}, {"jp_ruby": "<ruby>注文<rt>ちゅうもん</rt></ruby>された<ruby>品<rt>しな</rt></ruby>を、<ruby>相手<rt>あいて</rt></ruby>の<ruby>会社<rt>かいしゃ</rt></ruby>に<ruby>納<rt>おさ</rt></ruby>めた。", "vi": "Tôi đã giao mặt hàng được đặt tới công ty đối tác."}, {"jp_ruby": "<ruby>国<rt>くに</rt></ruby>を<ruby>治<rt>おさ</rt></ruby>める。", "vi": "Cai trị đất nước."}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": ["ヲ納入する", "ヲ統治する"]}}, {"no": 1033, "section": "Unit 12 動詞C", "kana": "そう", "word": "沿う／添う", "form_note": "ガ〜", "meaning_en": "line ~; go along with ~; satisfy, based on ~", "meaning_vi": "dọc theo; làm theo, dựa theo; đáp ứng, phù hợp với (ý muốn, kỳ vọng)", "examples": [{"jp_ruby": "<ruby>駅<rt>えき</rt></ruby>を<ruby>出<rt>で</rt></ruby>て<ruby>線路<rt>せんろ</rt></ruby>に<ruby>沿<rt>そ</rt></ruby>って<ruby>歩<rt>ある</rt></ruby>いた。", "vi": "Ra khỏi nhà ga, tôi đi bộ dọc theo đường ray."}, {"jp_ruby": "<ruby>要項<rt>ようこう</rt></ruby>に<ruby>沿<rt>そ</rt></ruby>って<ruby>入学<rt>にゅうがく</rt></ruby>を<ruby>申<rt>もう</rt></ruby>し<ruby>込<rt>こ</rt></ruby>んだ。", "vi": "Tôi đã đăng ký nhập học theo đúng hướng dẫn trong bản quy định."}, {"jp_ruby": "｛<ruby>計画<rt>けいかく</rt></ruby>／<ruby>方針<rt>ほうしん</rt></ruby>／マニュアル…｝に<ruby>沿<rt>そ</rt></ruby>って<ruby>行<rt>おこな</rt></ruby>う。", "vi": "Tiến hành theo {kế hoạch / phương châm / sổ tay hướng dẫn...}."}, {"jp_ruby": "「ご<ruby>期待<rt>きたい</rt></ruby>に<ruby>添<rt>そ</rt></ruby>えるよう、<ruby>精一杯<rt>せいいっぱい</rt></ruby>がんばります」", "vi": "「Tôi sẽ cố gắng hết sức mình để đáp ứng kỳ vọng của quý vị」"}, {"jp_ruby": "<ruby>相手<rt>あいて</rt></ruby>の｛<ruby>意向<rt>いこう</rt></ruby>／<ruby>希望<rt>きぼう</rt></ruby>…｝に<ruby>添<rt>そ</rt></ruby>う。", "vi": "Đáp ứng {ý định / mong muốn...} của đối phương."}], "usage": {"collocations": [], "compounds": ["線路沿い", "道沿い", "川沿い", "付き添う", "寄り添う", "連れ添う", "付き添い"], "antonyms": [], "related": [], "synonyms": ["ガ従う"]}}, {"no": 1034, "section": "Unit 12 動詞C", "kana": "そえる", "word": "添える", "form_note": "ヲ〜", "meaning_en": "attach (to ~), add (to ~); put; garnish", "meaning_vi": "đính kèm, thêm vào; đặt (tay) lên đỡ; điểm xuyết, tô điểm thêm", "examples": [{"jp_ruby": "<ruby>花束<rt>はなたば</rt></ruby>にカードを<ruby>添<rt>そ</rt></ruby>えて<ruby>贈<rt>おく</rt></ruby>る。", "vi": "Tặng bó hoa kèm theo tấm thiệp."}, {"jp_ruby": "コーヒーにクリームと<ruby>砂糖<rt>さとう</rt></ruby>を<ruby>添<rt>そ</rt></ruby>えて<ruby>出<rt>だ</rt></ruby>す。", "vi": "Dọn cà phê kèm theo kem và đường."}, {"jp_ruby": "けがをした<ruby>人<rt>ひと</rt></ruby>に<ruby>手<rt>て</rt></ruby>を<ruby>添<rt>そ</rt></ruby>えて<ruby>歩<rt>ある</rt></ruby>くのを<ruby>助<rt>たす</rt></ruby>けた。", "vi": "Tôi đặt tay đỡ người bị thương và giúp họ bước đi."}, {"jp_ruby": "<ruby>料理<rt>りょうり</rt></ruby>に<ruby>彩<rt>いろど</rt></ruby>りを<ruby>添<rt>そ</rt></ruby>えるために<ruby>花<rt>はな</rt></ruby>を<ruby>飾<rt>かざ</rt></ruby>った。", "vi": "Tôi đã trang trí hoa để điểm thêm màu sắc cho món ăn."}, {"jp_ruby": "<ruby>趣味<rt>しゅみ</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>の<ruby>生活<rt>せいかつ</rt></ruby>に<ruby>彩<rt>いろど</rt></ruby>りを<ruby>添<rt>そ</rt></ruby>えている。", "vi": "Sở thích làm cho cuộc sống của tôi thêm phần màu sắc."}, {"jp_ruby": "<ruby>歴史<rt>れきし</rt></ruby>のある<ruby>建物<rt>たてもの</rt></ruby>が<ruby>町<rt>まち</rt></ruby>に<ruby>趣<rt>おもむき</rt></ruby>を<ruby>添<rt>そ</rt></ruby>えている。", "vi": "Những tòa nhà giàu lịch sử làm tăng thêm nét duyên dáng cho khu phố."}, {"jp_ruby": "<ruby>美<rt>うつく</rt></ruby>しい<ruby>着物姿<rt>きものすがた</rt></ruby>の<ruby>女性<rt>じょせい</rt></ruby>たちがパーティーに<ruby>花<rt>はな</rt></ruby>を<ruby>添<rt>そ</rt></ruby>えた。", "vi": "Những người phụ nữ xinh đẹp trong trang phục kimono đã làm cho bữa tiệc thêm phần rực rỡ."}], "usage": {"collocations": ["花を添える"], "compounds": ["書き添える", "添え物", "介添え"], "antonyms": [], "related": [], "synonyms": ["ヲ付ける"]}}, {"no": 1035, "section": "Unit 12 動詞C", "kana": "かねる", "word": "兼ねる", "form_note": "ヲ〜; ※②は「動詞マス形＋かねる」の形で使う", "meaning_en": "serve both as; can not ~", "meaning_vi": "kiêm nhiệm, đồng thời đóng vai trò; không thể ~ (dạng lịch sự của sự không thể)", "examples": [{"jp_ruby": "この<ruby>家<rt>いえ</rt></ruby>は<ruby>住居<rt>じゅうきょ</rt></ruby>と<ruby>仕事場<rt>しごとば</rt></ruby>を<ruby>兼<rt>か</rt></ruby>ねている。", "vi": "Ngôi nhà này vừa là nơi ở, vừa là nơi làm việc."}, {"jp_ruby": "<ruby>取引先<rt>とりひきさき</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>と、<ruby>打<rt>う</rt></ruby>ち<ruby>合<rt>あ</rt></ruby>わせを<ruby>兼<rt>か</rt></ruby>ねて<ruby>食事<rt>しょくじ</rt></ruby>をした。", "vi": "Tôi đã dùng bữa kết hợp bàn bạc công việc với người của công ty đối tác."}, {"jp_ruby": "「その<ruby>件<rt>けん</rt></ruby>についてはわかりかねます」", "vi": "「Về việc đó thì tôi khó mà trả lời được (không rõ)」"}], "usage": {"collocations": [], "compounds": [], "antonyms": [], "related": [], "synonyms": []}}, {"no": 1036, "section": "Unit 12 動詞C", "kana": "てきする", "word": "適する", "form_note": "ガ〜", "meaning_en": "be suitable; deserve, be worthy (of ~)", "meaning_vi": "phù hợp, thích hợp; xứng đáng (với vị trí, vai trò)", "examples": [{"jp_ruby": "キャベツは、<ruby>冷涼<rt>れいりょう</rt></ruby>な<ruby>気候<rt>きこう</rt></ruby>に<ruby>適<rt>てき</rt></ruby>した<ruby>野菜<rt>やさい</rt></ruby>だ。", "vi"
